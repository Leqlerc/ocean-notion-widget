name: Live task progress

on:
  schedule:
    # Five staggered 5-minute schedules give us an intended sync opportunity every minute.
    # GitHub can still delay scheduled jobs under load, so the widget also reports staleness.
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [notion-task-changed]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-task-progress.yml'
      - 'scripts/sync_task_progress.py'
      - 'task-progress.html'

permissions:
  contents: write

concurrency:
  group: live-task-progress
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Query Notion and build progress feed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_task_progress.py

      - name: Commit changed progress data
        run: |
          if git diff --quiet -- task-progress.json; then
            echo "No progress change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-progress.json
          git commit -m "Sync live task progress"
          git pull --rebase origin main
          git push origin HEAD:main
