name: Live task progress

on:
  schedule:
    # Offset from :00/:05/etc. because GitHub's scheduler is busiest at those boundaries.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [notion-task-changed]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-task-progress.yml'
      - 'scripts/sync_task_progress.py'
      - 'task-progress.html'

permissions:
  contents: write

concurrency:
  group: live-task-progress
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Query Notion and build progress feed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_task_progress.py

      - name: Commit changed progress data
        run: |
          if git diff --quiet -- task-progress.json; then
            echo "No progress change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-progress.json
          git commit -m "Sync live task progress"
          git pull --rebase origin main
          git push origin HEAD:main
