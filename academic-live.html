<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;height:188px}.panel{position:relative;overflow:hidden;border:1px solid rgba(198,226,255,.22);border-radius:20px;padding:13px 14px;background:radial-gradient(circle at 12% 4%,rgba(173,216,255,.14),transparent 34%),radial-gradient(circle at 88% 16%,rgba(205,194,255,.10),transparent 34%),linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05)}.panel:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;bottom:-85px;background:rgba(177,222,255,.07);filter:blur(18px);pointer-events:none}.eyebrow{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#8fb5cb;font-weight:700}.pulse{display:grid;grid-template-rows:repeat(3,1fr);padding:7px 13px}.pulse-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 0}.pulse-row+.pulse-row{border-top:1px solid rgba(255,255,255,.06)}.pulse-name{font-size:12px;font-weight:760;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pulse-meta{font-size:8px;color:#7d96a6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pulse-right{text-align:right;min-width:62px}.pulse-count{font-size:13px;font-weight:780;color:#e5f4fc}.pulse-date{font-size:7.5px;color:#6f8796;margin-top:2px;white-space:nowrap}.semester{padding:11px 12px 10px}.sem-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:6px}.sem-title{font-size:11px;font-weight:760}.sem-sub{font-size:7.5px;color:#738b9a}.months{display:grid;grid-template-columns:18px repeat(17,minmax(0,1fr));gap:3px;margin-bottom:4px;font-size:7px;color:#718897}.gridrow{display:grid;grid-template-columns:18px 1fr;gap:4px}.days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:7px;color:#6f8594;line-height:11px;text-align:center}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:minmax(0,1fr);gap:3px}.cell{height:11px;border-radius:2.5px;border:1px solid rgba(255,255,255,.10);background:#56606b;opacity:.42}.cell.outside{opacity:.10}.cell.today{outline:1px solid rgba(255,255,255,.88);outline-offset:1px}.cell.l1{background:#9acdf7;opacity:.94}.cell.l2{background:#639fdb;opacity:.97}.cell.l3{background:#3675b6;opacity:1}.cell.l4{background:#174f8a;opacity:1}.cell.l5{background:#082b52;opacity:1}.sem-foot{display:flex;justify-content:space-between;gap:8px;margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.055);font-size:7px;color:#6c8290}.legend{display:flex;gap:4px}.sw{width:8px;height:8px;border-radius:2px}.s0{background:#56606b}.s1{background:#9acdf7}.s2{background:#639fdb}.s3{background:#3675b6}.s4{background:#174f8a}.s5{background:#082b52}.status{position:absolute;right:10px;bottom:5px;font-size:6.5px;color:#6f8796}@media(max-width:620px){.wrap{grid-template-columns:1fr;height:auto}.panel{height:188px}}</style></head><body><div class="wrap"><section class="panel pulse"><div class="pulse-row"><div><div class="eyebrow">Next class</div><div class="pulse-name" id="className">Loading…</div><div class="pulse-meta" id="classMeta"></div></div><div class="pulse-right"><div class="pulse-count" id="classCountdown">--</div><div class="pulse-date" id="afterClass"></div></div></div><div class="pulse-row"><div><div class="eyebrow">Next test</div><div class="pulse-name" id="testName">Loading…</div><div class="pulse-meta" id="testCourse"></div></div><div class="pulse-right"><div class="pulse-count" id="testCountdown">--</div><div class="pulse-date" id="testDate"></div></div></div><div class="pulse-row"><div><div class="eyebrow">Next exam</div><div class="pulse-name" id="examName">Loading…</div><div class="pulse-meta" id="examCourse"></div></div><div class="pulse-right"><div class="pulse-count" id="examCountdown">--</div><div class="pulse-date" id="examDate"></div></div></div><div class="status" id="status">connecting…</div></section><section class="panel semester"><div class="sem-head"><div><div class="eyebrow">Assignment workload</div><div class="sem-title">Fall 2026 assignments</div></div><div class="sem-sub">weeks →</div></div><div class="months" id="months"></div><div class="gridrow"><div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="heat" id="heat"></div></div><div class="sem-foot"><span>Gray = none due · darker blue = more assignments</span><span class="legend"><i class="sw s0"></i><i class="sw s1"></i><i class="sw s2"></i><i class="sw s3"></i><i class="sw s4"></i><i class="sw s5"></i></span></div></section></div><script>const TZ='America/Indiana/Indianapolis',DAY=86400000,START='2026-08-24',END='2026-12-19',API='/api/dashboard?scope=academics';const weekly=[{d:1,h:8,m:30,n:'MFET 163',r:'BHEE 129'},{d:1,h:9,m:30,n:'ENGR 161',r:'SHRV C111'},{d:1,h:12,m:30,n:'MA 261',r:'CL50 224'},{d:2,h:15,m:30,n:'MA 261 Recitation',r:'PHYS 202'},{d:3,h:7,m:30,n:'CS 159',r:'LWSN B155'},{d:3,h:9,m:30,n:'ENGR 161',r:'SHRV C111'},{d:3,h:12,m:30,n:'MA 261',r:'CL50 224'},{d:4,h:7,m:30,n:'MFET 163 Lab',r:'PHYS 022'},{d:4,h:11,m:30,n:'CS 159 Lab',r:'MTHW 301'},{d:5,h:7,m:30,n:'CS 159',r:'LWSN B155'},{d:5,h:9,m:30,n:'ENGR 161',r:'SHRV C111'},{d:5,h:12,m:30,n:'MA 261',r:'CL50 224'}];let DATA={assignments:{},events:{}};const $=id=>document.getElementById(id);function parts(){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}function nowLocal(){const p=parts();return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)}function key(ms){return new Date(ms).toISOString().slice(0,10)}function dateMs(s){const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)}function monday(ms){const d=new Date(ms).getUTCDay();return ms-((d+6)%7)*DAY}function human(ms){if(ms<=0)return'now';const m=Math.floor(ms/60000);if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h '+(m%60)+'m';return Math.floor(h/24)+'d '+(h%24)+'h'}function fmtDate(v){return new Intl.DateTimeFormat('en-US',{timeZone:TZ,month:'short',day:'numeric',weekday:'short'}).format(new Date(v))}function eventMs(e){if(!e.at)return 0;if(e.at.length===10)return new Date(e.at+'T12:00:00').getTime();return new Date(e.at).getTime()}function updateClass(){const n=nowLocal(),d=new Date(n),mid=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());let all=[];for(let i=0;i<8;i++){const dm=mid+i*DAY,dow=new Date(dm).getUTCDay();weekly.filter(c=>c.d===dow).forEach(c=>all.push({...c,s:dm+c.h*3600000+c.m*60000}))}all.sort((a,b)=>a.s-b.s);const x=all.find(v=>v.s>n);if(!x){$('className').textContent='No class queued';$('classCountdown').textContent='—';return}$('className').textContent=x.n;$('classMeta').textContent=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(x.s).getUTCDay()]+' · '+(x.h%12||12)+':'+String(x.m).padStart(2,'0')+(x.h>=12?' PM':' AM')+' · '+x.r;$('classCountdown').textContent=human(x.s-n)}function eventList(types){return Object.values(DATA.events||{}).flat().filter(e=>types.includes(e.type)).sort((a,b)=>eventMs(a)-eventMs(b))}function renderCountdown(types,prefix){const now=Date.now(),x=eventList(types).find(e=>eventMs(e)>now),g=s=>$(prefix+s);if(!x){g('Name').textContent='Nothing scheduled';g('Course').textContent='';g('Countdown').textContent='—';g('Date').textContent='';return}g('Name').textContent=x.name;g('Course').textContent=x.course||x.type;g('Countdown').textContent=human(eventMs(x)-now);g('Date').textContent=fmtDate(eventMs(x))}function renderHeat(){const start=dateMs(START),end=dateMs(END),gs=monday(start),today=key(nowLocal());$('months').innerHTML='<span></span>';$('heat').innerHTML='';let lm=-1;for(let w=0;w<17;w++){const ms=gs+w*7*DAY,m=new Date(ms).getUTCMonth(),s=document.createElement('span');if(m!==lm){s.textContent=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(new Date(ms));lm=m}$('months').appendChild(s)}for(let w=0;w<17;w++)for(let d=0;d<7;d++){const ms=gs+(w*7+d)*DAY,k=key(ms),items=DATA.assignments[k]||[],n=items.length,c=document.createElement('div');c.className='cell'+(n?' l'+Math.min(5,n):'');if(ms<start||ms>end)c.classList.add('outside');if(k===today)c.classList.add('today');c.title=k+' · '+n+' assignment'+(n===1?'':'s')+(n?' · '+items.map(x=>x.name).join(' • '):'');$('heat').appendChild(c)}}function render(){updateClass();renderCountdown(['Quiz','CFU','Roundtable'],'test');renderCountdown(['Exam','Practical'],'exam');renderHeat()}async function refresh(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);DATA=await r.json();$('status').textContent='live · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render()}catch(e){$('status').textContent='sync error';console.error(e)}}render();refresh();setInterval(refresh,15000);setInterval(()=>{updateClass();renderCountdown(['Quiz','CFU','Roundtable'],'test');renderCountdown(['Exam','Practical'],'exam')},30000);</script></body></html>
