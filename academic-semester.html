<!doctype html>
<html>

<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}body{padding:0}.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;height:188px}.panel{position:relative;overflow:hidden;border:1px solid rgba(198,226,255,.22);border-radius:20px;padding:13px 14px;background:radial-gradient(circle at 12% 4%,rgba(173,216,255,.14),transparent 34%),radial-gradient(circle at 88% 16%,rgba(205,194,255,.10),transparent 34%),linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05)}.panel:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;bottom:-85px;background:rgba(177,222,255,.07);filter:blur(18px);pointer-events:none}.eyebrow{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#8fb5cb;font-weight:700}.pulse{display:grid;grid-template-rows:repeat(3,1fr);padding:7px 13px}.pulse-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;position:relative;padding:7px 0}.pulse-row+.pulse-row{border-top:1px solid rgba(255,255,255,.06)}.pulse-left{min-width:0}.pulse-name{font-size:12px;font-weight:760;letter-spacing:-.015em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pulse-meta{font-size:8px;color:#7d96a6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pulse-right{text-align:right;min-width:62px}.pulse-count{font-size:13px;font-weight:780;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#e5f4fc}.pulse-date{font-size:7.5px;color:#6f8796;margin-top:2px;white-space:nowrap}
.semester{padding:11px 12px 10px}.sem-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:6px}.sem-title{font-size:11px;font-weight:760;letter-spacing:-.01em}.sem-sub{font-size:7.5px;color:#738b9a}.heat-wrap{position:relative;z-index:1}.months{display:grid;grid-template-columns:18px repeat(17,minmax(0,1fr));gap:3px;margin-bottom:4px;font-size:7px;color:#718897;line-height:1}.month{white-space:nowrap;overflow:visible}.gridrow{display:grid;grid-template-columns:18px 1fr;gap:4px}.days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:7px;color:#6f8594;line-height:11px;text-align:center}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:minmax(0,1fr);gap:3px}.cell{height:11px;border-radius:2.5px;border:1px solid rgba(255,255,255,.10);background:#56606b;opacity:.42;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:transform .12s ease,border-color .12s ease,opacity .12s ease}.cell:hover{transform:scale(1.22);border-color:rgba(255,255,255,.65);opacity:1;z-index:3}.cell.outside{opacity:.10}.cell.today{outline:1px solid rgba(255,255,255,.88);outline-offset:1px}.cell.l1{background:#d89b9b;opacity:.95}.cell.l2{background:#b55a5e;opacity:.97}.cell.l3{background:#87313a;opacity:1}.cell.l4{background:#5b151e;opacity:1}.cell.l5{background:#280509;opacity:1;box-shadow:0 0 8px rgba(124,23,32,.22),inset 0 1px 0 rgba(255,255,255,.05)}.sem-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.055);font-size:7px;color:#6c8290;position:relative;z-index:1}.legend{display:flex;align-items:center;gap:4px}.sw{width:8px;height:8px;border-radius:2px;border:1px solid rgba(255,255,255,.10)}.s0{background:#56606b;opacity:.42}.s1{background:#d89b9b}.s2{background:#b55a5e}.s3{background:#87313a}.s4{background:#5b151e}.s5{background:#280509}

<div class="wrap">
<section class="panel pulse">

const blocked=new Set(['2026-10-12','2026-10-13','2026-11-25','2026-11-26','2026-11-27']);
const TESTS=[{course:'ENGR 161',name:'CFU #1',at:'2026-09-11T13:30:00Z'},{course:'MA 261',name:'Recitation Quiz 3',at:'2026-09-15T19:30:00Z'},{course:'MA 261',name:'Recitation Quiz 4',at:'2026-09-22T19:30:00Z'},{course:'MA 261',name:'Recitation Quiz 5',at:'2026-09-29T19:30:00Z'},{course:'MA 261',name:'Recitation Quiz 6',at:'2026-10-20T19:30:00Z'},{course:'ENGR 161',name:'CFU #2',at:'2026-10-21T13:30:00Z'},{course:'MA 261',name:'Recitation Quiz 7',at:'2026-10-27T19:30:00Z'},{course:'MA 261',name:'Recitation Quiz 8',at:'2026-11-03T20:30:00Z'}];
const EXAMS=[{course:'ENGR 161',name:'Exam #1',at:'2026-09-28T13:30:00Z'},{course:'MA 261',name:'Midterm Exam 1',at:'2026-10-06T00:00:00Z'},{course:'MFET 163',name:'Exam 1 Due',at:'2026-10-10T03:59:00Z'},{course:'CS 159',name:'Midterm Exam 1',at:'2026-10-16T00:00:00Z'},{course:'ENGR 161',name:'Exam #2',at:'2026-10-28T13:30:00Z'},{course:'CS 159',name:'Midterm Exam 2',at:'2026-11-18T01:00:00Z'},{course:'MA 261',name:'Midterm Exam 2',at:'2026-11-19T01:00:00Z'},{course:'MFET 163',name:'Exam 2 Due',at:'2026-11-28T04:59:00Z'},{course:'ENGR 161',name:'Exam #3',at:'2026-12-02T14:30:00Z'}];
const LOAD={
'2026-09-09':{t:1,e:0,n:''},'2026-09-10':{t:4,e:1,n:'CS 159 — Lab Quiz 2'},'2026-09-11':{t:2,e:1,n:'ENGR 161 — CFU #1'},'2026-09-13':{t:1,e:0,n:''},'2026-09-14':{t:7,e:0,n:''},'2026-09-15':{t:1,e:1,n:'MA 261 — Recitation Quiz 3'},'2026-09-16':{t:2,e:0,n:''},'2026-09-17':{t:2,e:0,n:''},'2026-09-18':{t:2,e:0,n:''},'2026-09-21':{t:4,e:0,n:''},'2026-09-22':{t:5,e:1,n:'MA 261 — Recitation Quiz 4'},'2026-09-23':{t:1,e:0,n:''},'2026-09-24':{t:1,e:0,n:''},'2026-09-25':{t:1,e:0,n:''},'2026-09-28':{t:2,e:1,n:'ENGR 161 — Exam #1'},'2026-09-29':{t:1,e:1,n:'MA 261 — Recitation Quiz 5'},'2026-09-30':{t:1,e:0,n:''},'2026-10-01':{t:1,e:0,n:''},'2026-10-02':{t:2,e:0,n:''},'2026-10-04':{t:1,e:0,n:''},'2026-10-05':{t:1,e:0,n:''},'2026-10-06':{t:2,e:1,n:'MA 261 — Midterm Exam 1'},'2026-10-08':{t:1,e:0,n:''},'2026-10-10':{t:1,e:1,n:'MFET 163 — Exam 1 Due'},'2026-10-15':{t:1,e:1,n:'MFET 163 — Practical 1'},'2026-10-16':{t:2,e:1,n:'CS 159 — Midterm Exam 1'},'2026-10-20':{t:2,e:1,n:'MA 261 — Recitation Quiz 6'},'2026-10-21':{t:2,e:1,n:'ENGR 161 — CFU #2'},'2026-10-22':{t:1,e:0,n:''},'2026-10-23':{t:1,e:0,n:''},'2026-10-26':{t:2,e:0,n:''},'2026-10-27':{t:1,e:1,n:'MA 261 — Recitation Quiz 7'},'2026-10-28':{t:2,e:1,n:'ENGR 161 — Exam #2'},'2026-10-29':{t:1,e:0,n:''},'2026-10-30':{t:1,e:0,n:''},'2026-11-02':{t:2,e:0,n:''},'2026-11-03':{t:2,e:1,n:'MA 261 — Recitation Quiz 8'},'2026-11-04':{t:1,e:0,n:''},'2026-11-05':{t:1,e:0,n:''},'2026-11-06':{t:1,e:0,n:''},'2026-11-09':{t:1,e:0,n:''},'2026-11-10':{t:1,e:1,n:'MA 261 — Recitation Quiz 9'},'2026-11-11':{t:2,e:0,n:''},'2026-11-12':{t:1,e:0,n:''},'2026-11-13':{t:2,e:0,n:''},'2026-11-16':{t:1,e:0,n:''},'2026-11-17':{t:1,e:0,n:''},'2026-11-18':{t:2,e:2,n:'CS 159 — Midterm Exam 2 • ENGR 161 — CFU #3'},'2026-11-19':{t:2,e:1,n:'MA 261 — Midterm Exam 2'},'2026-11-23':{t:2,e:0,n:''},'2026-11-28':{t:1,e:1,n:'MFET 163 — Exam 2 Due'},'2026-12-01':{t:1,e:1,n:'MA 261 — Recitation Quiz 10'},'2026-12-02':{t:2,e:1,n:'ENGR 161 — Exam #3'},'2026-12-03':{t:1,e:0,n: };
function p(){const f=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'});return Object.fromEntries(f.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}
function nowLocal(){const x=p();return Date.UTC(+x.year,+x.month-1,+x.day,+x.hour,+x.minute,+x.second)}
function key(ms){return new Date(ms).toISOString().slice(0,10)}
function dateMs(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function monday(ms){const dow=new Date(ms).getUTCDay();return ms-((dow+6)%7)*DAY}
function fmtTime(h,m){const a=h>=12?'PM':'AM';return (h%12||12)+':'+String(m).padStart(2,'0')+' '+a}
function events(){const n=nowLocal(),base=new Date(n),midnight=Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate());let out=[];for(let i=0;i<15;i++){const dms=midnight+i*DAY,dt=new Date(dms),ymd=key(dms);if(ymd<'2026-08-24'||ymd>'2026-12-11'||blocked.has(ymd))continue;const dow=dt.getUTCDay();weekly.filter(c=>c.d===dow).forEach(c=>out.push({s:dms+c.h*3600000+c.m*60000,e:dms+c.e*3600000+c.em*60000,n:c.n,r:c.r,h:c.h,m:c.m}))}special.forEach(x=>{const d=Date.parse(x[0]+'T00:00:00Z');if(d>=midnight-DAY&&d<=midnight+15*DAY)out.push({s:d+x[1]*3600000+x[2]*60000,e:d+x[3]*3600000+x[4]*60000,n:x[5],r:x[6],h:x[1],m:x[2]})});return out.sort((a,b)=>a.s-b.s)}
function human(ms){if(ms<=0)return'now';const min=Math.floor(ms/60000);if(min<60)return min+'m';const h=Math.floor(min/60),m=min%60;if(h<24)return h+'h'+(m?' '+m+'m':'');const d=Math.floor(h/24);return d+'d '+(h%24)+'h'}
function fmtDate(at){return new Intl.DateTimeFormat('en-US',{timeZone:TZ,month:'short',day:'numeric',weekday:'short'}).format(new Date(at))}
function updateClass(){const n=nowLocal(),ev=events();let cur=ev.find(x=>n>=x.s&&n<x.e),next=cur||ev.find(x=>x.s>n);if(!next){className.textContent='No class queued';classMeta.textContent='';classCountdown.textContent='—';afterClass.textContent='';return}const d=new Date(next.s),day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()];className.textContent=next.n;classMeta.textContent=day+' · '+fmtTime(next.h,next.m)+' · '+next.r;classCountdown.textContent=cur?'now':human(next.s-n);const after=ev.find(x=>x.s>next.e);afterClass.textContent=after?('then '+after.n):''}
function renderCountdown(list,prefix){const now=Date.now(),x=list.find(v=>new Date(v.at).getTime()>now),a=id=>document.getElementById(prefix+id);if(!x){a('Name').textContent='Nothing loaded';a('Course').textContent='';a('Countdown').textContent='—';a('Date').textContent='';return}a('Name').textContent=x.name;a('Course').textContent=x.course;a('Countdown').textContent=human(new Date(x.at).getTime()-now);a('Date').textContent=fmtDate(x.at)}
function majorExam(name){return /Midterm|Exam #|Practical|Exam 1 Due|Exam 2 Due/i.test(name||'')}
function level(v){if(!v||!v.t)return 0;if(majorExam(v.n))return 5;if(v.t>=6)return 5;if(v.e>0)return Math.min(4,Math.max(3,v.t+2));if(v.t>=4)return 4;if(v.t===3)return 3;if(v.t===2)return 2;return 1}
function renderSemester(){const start=dateMs(SEM_START),end=dateMs(SEM_END),gridStart=monday(start),weeks=17,today=key(nowLocal()),months=document.getElementById('months'),heat=document.getElementById('heat');months.innerHTML='<span></span>';heat.innerHTML='';let lastMonth=-1;for(let w=0;w<weeks;w++){const ms=gridStart+w*7*DAY,dt=new Date(ms),m=dt.getUTCMonth(),s=document.createElement('span');s.className='month';if(m!==lastMonth){s.textContent=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(dt);lastMonth=m}months.appendChild(s)}for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const ms=gridStart+(w*7+d)*DAY,k=key(ms),v=LOAD[k]||{t:0,e:0,n:''},c=document.createElement('div'),lv=level(v);c.className='cell'+(lv?' l'+lv:'');if(ms<start||ms>end)c.classList.add('outside');if(k===today)c.classList.add('today');let tip=k+' · '+v.t+' due';if(v.n)tip+=' · '+v.n;c.title=tip;heat.appendChild(c)}}
function updateAll(){updateClass();renderCountdown(TESTS,'test');renderCountdown(EXAMS,'exam');renderSemester()}updateAll();setInterval(()=>{updateClass();renderCountdown(TESTS,'test');renderCountdown(EXAMS,'exam')},30000);setInterval(renderSemester,300000);
