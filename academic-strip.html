<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}body{padding:0}.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;height:188px}.panel{position:relative;overflow:hidden;border:1px solid rgba(198,226,255,.22);border-radius:20px;padding:13px 14px;background:radial-gradient(circle at 12% 4%,rgba(173,216,255,.14),transparent 34%),radial-gradient(circle at 88% 16%,rgba(205,194,255,.10),transparent 34%),linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05)}.panel:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;bottom:-85px;background:rgba(177,222,255,.07);filter:blur(18px);pointer-events:none}.eyebrow{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#8fb5cb;font-weight:700}.pulse{display:grid;grid-template-rows:repeat(3,1fr);padding:7px 13px}.pulse-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;position:relative;padding:7px 0}.pulse-row+.pulse-row{border-top:1px solid rgba(255,255,255,.06)}.pulse-left{min-width:0}.pulse-name{font-size:12px;font-weight:760;letter-spacing:-.015em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pulse-meta{font-size:8px;color:#7d96a6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pulse-right{text-align:right;min-width:62px}.pulse-count{font-size:13px;font-weight:780;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#e5f4fc}.pulse-date{font-size:7.5px;color:#6f8796;margin-top:2px;white-space:nowrap}.work-head{display:flex;justify-content:space-between;align-items:flex-end}.total{font-size:10.5px;color:#9db6c5}.bars{height:102px;margin-top:11px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;gap:7px}.day{height:100%;display:grid;grid-template-rows:1fr auto;gap:6px;min-width:0}.barbox{height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}.bar{width:100%;max-width:28px;min-height:4px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#c8edff,#b9d8f6 55%,#c9c2f0);box-shadow:0 0 14px rgba(185,220,255,.10);opacity:.9}.num{position:absolute;bottom:calc(var(--h) + 5px);font-size:9px;color:#c7dce8}.lab{text-align:center;white-space:nowrap}.dow{font-size:8.5px;color:#809aaa;text-transform:uppercase;letter-spacing:.05em}.date{font-size:8px;color:#5f7888;margin-top:1px}.today .dow{color:#d9f3ff}.today .bar{box-shadow:0 0 16px rgba(188,232,255,.25)}.foot{position:absolute;bottom:13px;left:16px;right:16px;font-size:9px;color:#708b9c}.legend{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.06);padding-top:9px}.legend strong{font-weight:600;color:#aac5d5}.legend span:last-child{font-variant-numeric:tabular-nums}@media(max-width:620px){.wrap{grid-template-columns:1fr;height:auto}.panel{height:188px}}
</style></head><body><div class="wrap">
<section class="panel pulse">
  <div class="pulse-row"><div class="pulse-left"><div class="eyebrow">Next class</div><div class="pulse-name" id="className">Loading…</div><div class="pulse-meta" id="classMeta"></div></div><div class="pulse-right"><div class="pulse-count" id="classCountdown">--</div><div class="pulse-date" id="afterClass"></div></div></div>
  <div class="pulse-row"><div class="pulse-left"><div class="eyebrow">Next test</div><div class="pulse-name" id="testName">Loading…</div><div class="pulse-meta" id="testCourse"></div></div><div class="pulse-right"><div class="pulse-count" id="testCountdown">--</div><div class="pulse-date" id="testDate"></div></div></div>
  <div class="pulse-row"><div class="pulse-left"><div class="eyebrow">Next exam</div><div class="pulse-name" id="examName">Loading…</div><div class="pulse-meta" id="examCourse"></div></div><div class="pulse-right"><div class="pulse-count" id="examCountdown">--</div><div class="pulse-date" id="examDate"></div></div></div>
</section>
<section class="panel"><div class="work-head"><div><div class="eyebrow">7-day workload</div></div><div class="total" id="total"></div></div><div class="bars" id="bars"></div><div class="foot"><div class="legend"><strong>School deadlines</strong><span id="peak"></span></div></div></section>
</div><script>
const TZ='America/Indiana/Indianapolis';
const weekly=[{d:1,h:8,m:30,e:9,em:20,n:'MFET 163',r:'BHEE 129'},{d:1,h:9,m:30,e:11,em:20,n:'ENGR 161',r:'SHRV C111'},{d:1,h:12,m:30,e:13,em:20,n:'MA 261',r:'CL50 224'},{d:2,h:15,m:30,e:16,em:20,n:'MA 261 Recitation',r:'PHYS 202'},{d:3,h:7,m:30,e:8,em:20,n:'CS 159',r:'LWSN B155'},{d:3,h:9,m:30,e:11,em:20,n:'ENGR 161',r:'SHRV C111'},{d:3,h:12,m:30,e:13,em:20,n:'MA 261',r:'CL50 224'},{d:4,h:7,m:30,e:9,em:20,n:'MFET 163 Lab',r:'PHYS 022'},{d:4,h:11,m:30,e:13,em:20,n:'CS 159 Lab',r:'MTHW 301'},{d:5,h:7,m:30,e:8,em:20,n:'CS 159',r:'LWSN B155'},{d:5,h:9,m:30,e:11,em:20,n:'ENGR 161',r:'SHRV C111'},{d:5,h:12,m:30,e:13,em:20,n:'MA 261',r:'CL50 224'}];
const special=[['2026-09-22',17,0,17,50,'HONR 19901','HCRN 1066'],['2026-10-20',17,0,17,50,'HONR 19901','HCRN 1066'],['2026-12-01',17,0,17,50,'HONR 19901','HCRN 1066']];
const blocked=new Set(['2026-10-12','2026-10-13','2026-11-25','2026-11-26','2026-11-27']);
const TESTS=[
{course:'ENGR 161',name:'CFU #1',at:'2026-09-11T13:30:00Z'},
{course:'MA 261',name:'Recitation Quiz 3',at:'2026-09-15T19:30:00Z'},
{course:'MA 261',name:'Recitation Quiz 4',at:'2026-09-22T19:30:00Z'},
{course:'MA 261',name:'Recitation Quiz 5',at:'2026-09-29T19:30:00Z'},
{course:'MA 261',name:'Recitation Quiz 6',at:'2026-10-20T19:30:00Z'},
{course:'ENGR 161',name:'CFU #2',at:'2026-10-21T13:30:00Z'},
{course:'MA 261',name:'Recitation Quiz 7',at:'2026-10-27T19:30:00Z'},
{course:'MA 261',name:'Recitation Quiz 8',at:'2026-11-03T20:30:00Z'}];
const EXAMS=[
{course:'ENGR 161',name:'Exam #1',at:'2026-09-28T13:30:00Z'},
{course:'MA 261',name:'Midterm Exam 1',at:'2026-10-06T00:00:00Z'},
{course:'MFET 163',name:'Exam 1 Due',at:'2026-10-10T03:59:00Z'},
{course:'CS 159',name:'Midterm Exam 1',at:'2026-10-16T00:00:00Z'},
{course:'ENGR 161',name:'Exam #2',at:'2026-10-28T13:30:00Z'},
{course:'CS 159',name:'Midterm Exam 2',at:'2026-11-18T01:00:00Z'},
{course:'MA 261',name:'Midterm Exam 2',at:'2026-11-19T01:00:00Z'},
{course:'MFET 163',name:'Exam 2 Due',at:'2026-11-28T04:59:00Z'},
{course:'ENGR 161',name:'Exam #3',at:'2026-12-02T14:30:00Z'}];
const workload={"2026-09-10":1,"2026-09-11":1,"2026-09-14":7,"2026-09-15":1,"2026-09-16":2,"2026-09-17":2,"2026-09-18":2,"2026-09-21":4,"2026-09-22":5,"2026-09-23":1,"2026-09-24":1,"2026-09-25":1,"2026-09-28":2,"2026-09-29":1,"2026-09-30":1,"2026-10-01":1,"2026-10-02":2,"2026-10-04":1,"2026-10-05":1,"2026-10-06":2,"2026-10-08":1,"2026-10-10":1,"2026-10-15":1,"2026-10-16":2,"2026-10-20":2,"2026-10-21":2,"2026-10-22":1,"2026-10-23":1,"2026-10-26":2,"2026-10-27":1,"2026-10-28":2,"2026-10-29":1,"2026-10-30":1,"2026-11-02":2,"2026-11-03":2,"2026-11-04":1,"2026-11-05":1,"2026-11-06":1,"2026-11-09":1,"2026-11-10":1,"2026-11-11":2,"2026-11-12":1,"2026-11-13":2,"2026-11-16":1,"2026-11-17":1,"2026-11-18":2,"2026-11-19":2,"2026-11-23":2,"2026-11-28":1,"2026-12-01":1,"2026-12-02":2,"2026-12-03":1,"2026-12-04":1,"2026-12-07":2,"2026-12-09":1,"2026-12-10":2,"2026-12-11":1,"2026-12-14":2};
function p(){const f=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'});return Object.fromEntries(f.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}
function nowLocal(){const x=p();return Date.UTC(+x.year,+x.month-1,+x.day,+x.hour,+x.minute,+x.second)}
function key(ms){return new Date(ms).toISOString().slice(0,10)}
function fmtTime(h,m){const a=h>=12?'PM':'AM';return (h%12||12)+':'+String(m).padStart(2,'0')+' '+a}
function events(){const n=nowLocal(),base=new Date(n),midnight=Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate());let out=[];for(let i=0;i<15;i++){const dms=midnight+i*86400000,dt=new Date(dms),ymd=key(dms);if(ymd<'2026-08-24'||ymd>'2026-12-11'||blocked.has(ymd))continue;const dow=dt.getUTCDay();weekly.filter(c=>c.d===dow).forEach(c=>out.push({s:dms+c.h*3600000+c.m*60000,e:dms+c.e*3600000+c.em*60000,n:c.n,r:c.r,h:c.h,m:c.m}))}special.forEach(x=>{const d=Date.parse(x[0]+'T00:00:00Z');if(d>=midnight-86400000&&d<=midnight+15*86400000)out.push({s:d+x[1]*3600000+x[2]*60000,e:d+x[3]*3600000+x[4]*60000,n:x[5],r:x[6],h:x[1],m:x[2]})});return out.sort((a,b)=>a.s-b.s)}
function human(ms){if(ms<=0)return'now';const min=Math.floor(ms/60000);if(min<60)return min+'m';const h=Math.floor(min/60),m=min%60;if(h<24)return h+'h'+(m?' '+m+'m':'');const d=Math.floor(h/24);return d+'d '+(h%24)+'h'}
function fmtDate(at){return new Intl.DateTimeFormat('en-US',{timeZone:TZ,month:'short',day:'numeric',weekday:'short'}).format(new Date(at))}
function updateClass(){const n=nowLocal(),ev=events();let cur=ev.find(x=>n>=x.s&&n<x.e),next=cur||ev.find(x=>x.s>n);if(!next){document.getElementById('className').textContent='No class queued';document.getElementById('classMeta').textContent='';document.getElementById('classCountdown').textContent='—';document.getElementById('afterClass').textContent='';return}const d=new Date(next.s),day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()];document.getElementById('className').textContent=next.n;document.getElementById('classMeta').textContent=day+' · '+fmtTime(next.h,next.m)+' · '+next.r;document.getElementById('classCountdown').textContent=cur?'now':human(next.s-n);const after=ev.find(x=>x.s>next.e);document.getElementById('afterClass').textContent=after?('then '+after.n):''}
function renderCountdown(list,prefix){const now=Date.now(),x=list.find(v=>new Date(v.at).getTime()>now);if(!x){document.getElementById(prefix+'Name').textContent='Nothing loaded';document.getElementById(prefix+'Course').textContent='';document.getElementById(prefix+'Countdown').textContent='—';document.getElementById(prefix+'Date').textContent='';return}document.getElementById(prefix+'Name').textContent=x.name;document.getElementById(prefix+'Course').textContent=x.course;document.getElementById(prefix+'Countdown').textContent=human(new Date(x.at).getTime()-now);document.getElementById(prefix+'Date').textContent=fmtDate(x.at)}
function updateWork(){const n=nowLocal(),d=new Date(n),mid=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()),vals=[];for(let i=0;i<7;i++){const ms=mid+i*86400000,k=key(ms),dt=new Date(ms);vals.push({ms,k,c:workload[k]||0,dow:['S','M','T','W','T','F','S'][dt.getUTCDay()],date:(dt.getUTCMonth()+1)+'/'+dt.getUTCDate(),today:i===0})}const max=Math.max(1,...vals.map(x=>x.c)),sum=vals.reduce((a,b)=>a+b.c,0),peak=Math.max(...vals.map(x=>x.c));document.getElementById('total').textContent=sum+' due';document.getElementById('peak').textContent=peak?('peak '+peak+'/day'):'clear week';const root=document.getElementById('bars');root.innerHTML='';vals.forEach(x=>{const h=x.c?Math.max(14,Math.round(74*x.c/max)):4,el=document.createElement('div');el.className='day'+(x.today?' today':'');el.innerHTML='<div class="barbox"><span class="num" style="--h:'+h+'px">'+(x.c||'')+'</span><div class="bar" style="height:'+h+'px"></div></div><div class="lab"><div class="dow">'+x.dow+'</div><div class="date">'+x.date+'</div></div>';root.appendChild(el)})}
function updateAll(){updateClass();renderCountdown(TESTS,'test');renderCountdown(EXAMS,'exam');updateWork()}updateAll();setInterval(()=>{updateClass();renderCountdown(TESTS,'test');renderCountdown(EXAMS,'exam')},30000);setInterval(updateWork,300000);
</script></body></html>
