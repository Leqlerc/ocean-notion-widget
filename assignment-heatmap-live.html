<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}.panel{position:relative;overflow:hidden;border:1px solid rgba(198,226,255,.22);border-radius:20px;padding:12px 13px 10px;background:radial-gradient(circle at 12% 4%,rgba(173,216,255,.14),transparent 34%),linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05);min-height:152px}.eyebrow{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#8fb5cb;font-weight:700}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:8px}.title{font-size:12px;font-weight:760;margin-top:2px}.sub{font-size:7px;color:#718897}.months{display:grid;grid-template-columns:18px repeat(17,minmax(0,1fr));gap:3px;margin-bottom:4px;font-size:7px;color:#718897}.gridrow{display:grid;grid-template-columns:18px 1fr;gap:4px}.days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:7px;color:#6f8594;line-height:11px;text-align:center}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:minmax(0,1fr);gap:3px}.cell{height:11px;border-radius:2.5px;border:1px solid rgba(255,255,255,.10);background:#56606b;opacity:.42}.cell:hover{transform:scale(1.18);border-color:rgba(255,255,255,.65);opacity:1;z-index:2}.cell.outside{opacity:.10}.cell.today{outline:1px solid rgba(255,255,255,.88);outline-offset:1px}.cell.l1{background:#9acdf7;opacity:.94}.cell.l2{background:#639fdb;opacity:.97}.cell.l3{background:#3675b6;opacity:1}.cell.l4{background:#174f8a;opacity:1}.cell.l5{background:#082b52;opacity:1}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.055);font-size:7px;color:#6c8290}.legend{display:flex;gap:4px}.sw{width:8px;height:8px;border-radius:2px}.s0{background:#56606b}.s1{background:#9acdf7}.s2{background:#639fdb}.s3{background:#3675b6}.s4{background:#174f8a}.s5{background:#082b52}</style></head><body><section class="panel"><div class="head"><div><div class="eyebrow">Assignment workload</div><div class="title">Fall 2026 assignments</div></div><div class="sub" id="status">connecting…</div></div><div class="months" id="months"></div><div class="gridrow"><div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="heat" id="heat"></div></div><div class="foot"><span>Gray = none due · darker blue = more assignments</span><span class="legend"><i class="sw s0"></i><i class="sw s1"></i><i class="sw s2"></i><i class="sw s3"></i><i class="sw s4"></i><i class="sw s5"></i></span></div></section><script>const TZ='America/Indiana/Indianapolis',DAY=86400000,START='2026-08-24',END='2026-12-19',API='/api/dashboard?scope=academics';let DATA={assignments:{}};const $=id=>document.getElementById(id);function parts(){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}function nowLocal(){const p=parts();return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)}function key(ms){return new Date(ms).toISOString().slice(0,10)}function dateMs(s){const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}function monday(ms){const d=new Date(ms).getUTCDay();return ms-((d+6)%7)*DAY}function render(){const start=dateMs(START),end=dateMs(END),gs=monday(start),today=key(nowLocal());$('months').innerHTML='<span></span>';$('heat').innerHTML='';let lm=-1;for(let w=0;w<17;w++){const ms=gs+w*7*DAY,m=new Date(ms).getUTCMonth(),s=document.createElement('span');if(m!==lm){s.textContent=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(new Date(ms));lm=m}$('months').appendChild(s)}for(let w=0;w<17;w++)for(let d=0;d<7;d++){const ms=gs+(w*7+d)*DAY,k=key(ms),items=DATA.assignments[k]||[],n=items.length,c=document.createElement('div');c.className='cell'+(n?' l'+Math.min(5,n):'');if(ms<start||ms>end)c.classList.add('outside');if(k===today)c.classList.add('today');c.title=k+' · '+n+' assignment'+(n===1?'':'s')+(n?' · '+items.map(x=>x.name).join(' • '):'');$('heat').appendChild(c)}}async function refresh(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();DATA=await r.json();$('status').textContent='Notion live';render()}catch(e){$('status').textContent='sync error'}}render();refresh();setInterval(refresh,15000);</script></body></html>
