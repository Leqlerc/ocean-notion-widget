<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#07121f}.loading{min-height:540px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(155deg,#071522,#05101c);color:#8eacbf;font:12px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="loading">Loading athletics…</div><script>(async()=>{try{let src=await fetch('./athletics-direct.html?crisp=2',{cache:'no-store'}).then(r=>r.text());src=src.replace('linear-gradient(180deg,rgba(2,8,17,.22),rgba(2,8,17,.42))','linear-gradient(180deg,rgba(2,8,17,.10),rgba(2,8,17,.26))').replace('text-shadow:0 1px 8px rgba(0,0,0,.82)','text-shadow:0 1px 5px rgba(0,0,0,.74)');document.open();document.write(src);document.close()}catch(e){document.body.innerHTML='<div class="loading">Could not load widget</div>';console.error(e)}})();</script></body></html>
