 rgba(0,0,0,.82)}</style>`;const html=base.replace('</head>',extra+'</head>').replace('Weekly quota','Athletics');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading">Could not load widget</div>';console.error(e)}})();</script></body></html>
