<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}.card{position:relative;overflow:hidden;border:1px solid rgba(225,241,255,.42);border-radius:22px;padding:14px;background:linear-gradient(180deg,rgba(2,8,17,.14),rgba(2,8,17,.32)),url('./grand%20reef.png') 50% 48%/cover no-repeat;box-shadow:0 16px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.10)}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c9e3f1}.title{font-size:16px;font-weight:780;margin-top:2px}.date{font-size:10px;color:#a9c0cf;text-align:right}.row{margin-top:10px}.meta{display:flex;justify-content:space-between;margin-bottom:6px}.label{font-size:11px;font-weight:720}.pct{font-size:10px;color:#c8e6f7}.track{height:14px;border-radius:999px;border:1px solid rgba(236,246,255,.62);background:rgba(2,9,18,.58);overflow:hidden}.fill{height:100%;border-radius:999px}.semester .fill{background:linear-gradient(90deg,#72ddff,#9fd4ff 55%,#baa5ff)}.year .fill{background:linear-gradient(90deg,#79e2ad,#95dbc9 55%,#8dccf4)}.college .fill{background:linear-gradient(90deg,#968cff,#bc94eb 55%,#df9cda)}.quota{margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12)}.quota-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.quota-title{font-size:13px;font-weight:760}.quota-count{font-size:10px;color:#b5cbd8}.quota-row{display:flex;align-items:flex-start;gap:7px}.quota-name{width:43px;flex:0 0 43px;font-size:11px;color:#d4e6f1;padding-top:8px}.quota-circles{display:flex;justify-content:space-between;gap:4px;flex:1}.quota-item{display:flex;flex-direction:column;align-items:center;gap:4px}.quota-circle,.simple-circle{appearance:none;border-radius:50%;border:1.2px solid rgba(255,255,255,.72);background:rgba(5,15,28,.40);cursor:pointer}.quota-circle{width:31px;height:31px;font:700 10px/1 Inter;color:#d9e8f1}.quota-circle.rest{border-style:dashed;cursor:default}.quota-circle.yellow{background:linear-gradient(145deg,#fff1ad,#f4d77b);color:#18222b}.quota-circle.green{background:linear-gradient(145deg,#c9f2d5,#96d7ad);color:#18222b}.quota-circle.purple{background:linear-gradient(145deg,#e2d3ff,#bba2f2);color:#18222b}.quota-circle.done:not(.yellow):not(.green):not(.purple){background:linear-gradient(145deg,#c9edff,#aadcf5);color:#18222b}.quota-day{font-size:8.5px;color:#8ca4b3}.simple-quota{margin-top:12px;display:grid;gap:9px}.simple-row{display:grid;grid-template-columns:52px 1fr 32px;gap:7px;align-items:center}.simple-name{font-size:11px;color:#d5e4ed}.simple-circles{display:flex;gap:6px}.simple-circle{width:25px;height:25px}.simple-circle.done{background:linear-gradient(145deg,#d6f2df,#b7dfc6)}.simple-count{font-size:10px;text-align:right;color:#b5cbd8}.foot{display:flex;justify-content:space-between;margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.08);font-size:9px;color:#8ea6b5}@media(max-width:360px){.card{padding:12px 11px}.quota-circle{width:29px;height:29px}.simple-row{grid-template-columns:48px 1fr 28px}.simple-circle{width:23px;height:23px}}</style></head><body><div class="card"><div class="top"><div><div class="eyebrow">Athletics</div><div class="title">Weekly training</div></div><div class="date" id="date"></div></div><div class="row semester"><div class="meta"><span class="label">Semester progress</span><span class="pct" id="semesterPct"></span></div><div class="track"><div class="fill" id="semesterFill"></div></div></div><div class="row year"><div class="meta"><span class="label">School year progress</span><span class="pct" id="yearPct"></span></div><div class="track"><div class="fill" id="yearFill"></div></div></div><div class="row college"><div class="meta"><span class="label">College 4-year progress</span><span class="pct" id="collegePct"></span></div><div class="track"><div class="fill" id="collegeFill"></div></div></div><div class="quota"><div class="quota-head"><div class="quota-title">Athletics</div><div class="quota-count" id="workoutCount">0 / 6 workouts</div></div><div class="quota-row"><div class="quota-name">Workout</div><div class="quota-circles" id="workouts"></div></div><div class="simple-quota" id="simple"></div></div><div class="foot"><span id="status">connecting…</span><span>Notion · live</span></div></div><script>const TZ='America/Indiana/Indianapolis',DAY=86400000,API='/api/dashboard?scope=daily',PLANS=['Push','Pull','Legs','Rest','Push','Pull','Legs'],SHORT=['P','P','L','R','P','P','L'],DAYS_L=['M','T','W','T','F','S','S'],TARGETS={Stretch:5,Swim:2,Rehab:5,Cardio:3};let DATA={};const $=id=>document.getElementById(id);function todayMs(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day)}function monday(ms){const d=new Date(ms).getUTCDay();return ms-((d+6)%7)*DAY}function iso(ms){return new Date(ms).toISOString().slice(0,10)}function pct(a,b){return Math.max(0,Math.min(100,(todayMs()-Date.UTC(...a))/(Date.UTC(...b)-Date.UTC(...a))*100))}function bar(id,v){$(id+'Fill').style.width=v.toFixed(1)+'%';$(id+'Pct').textContent=Math.round(v)+'%'}function qualityClass(q){return q==='Not great'?'yellow':q==='Productive'?'green':q==='Great'?'purple':''}function cycle(q){return q==='Not great'?'Productive':q==='Productive'?'Great':q==='Great'?'':'Not great'}async function write(k,changes){DATA[k]=DATA[k]||{athletics:{},workout:{}};if('Workout Quality'in changes)DATA[k].workout.quality=changes['Workout Quality'];if('Workout Type'in changes)DATA[k].workout.type=changes['Workout Type'];for(const n of Object.keys(TARGETS))if(n in changes)DATA[k].athletics[n]=changes[n];render();try{const r=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:k,changes})});if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json();DATA=x.days||DATA;render()}catch(e){$('status').textContent='sync error';console.error(e)}}function render(){const mon=monday(todayMs()),root=$('workouts');root.innerHTML='';let done=0;for(let i=0;i<7;i++){const k=iso(mon+i*DAY),plan=PLANS[i],row=DATA[k]||{},w=row.workout||{},isDone=!!w.done||!!w.quality;if(plan!=='Rest'&&isDone)done++;const item=document.createElement('div'),b=document.createElement('button'),lab=document.createElement('span');item.className='quota-item';b.className='quota-circle '+(plan==='Rest'?'rest':(isDone?'done ':'')+qualityClass(w.quality));b.textContent=SHORT[i];lab.className='quota-day';lab.textContent=DAYS_L[i];if(plan!=='Rest'){b.title=k+' · '+plan+' · '+(w.quality||'click to rate');b.onclick=()=>write(k,{'Workout Quality':cycle(w.quality||''),'Workout Type':plan})}item.append(b,lab);root.appendChild(item)}$('workoutCount').textContent=done+' / 6 workouts';const s=$('simple');s.innerHTML='';for(const [name,target] of Object.entries(TARGETS)){let count=0;for(let i=0;i<7;i++){const k=iso(mon+i*DAY);if(DATA[k]?.athletics?.[name])count++}const row=document.createElement('div'),n=document.createElement('div'),cir=document.createElement('div'),c=document.createElement('div');row.className='simple-row';n.className='simple-name';n.textContent=name;cir.className='simple-circles';for(let j=0;j<target;j++){const b=document.createElement('button');b.className='simple-circle'+(j<count?' done':'');b.title='Toggle '+name+' for today';b.onclick=()=>{const k=iso(todayMs()),cur=!!DATA[k]?.athletics?.[name];write(k,{[name]:!cur})};cir.appendChild(b)}c.className='simple-count';c.textContent=count+' / '+target;row.append(n,cir,c);s.appendChild(row)}$('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,month:'short',day:'numeric'}).format(new Date());bar('semester',pct([2026,7,24],[2026,11,19]));bar('year',pct([2026,7,24],[2027,4,9]));bar('college',pct([2026,7,24],[2030,4,11]))}async function refresh(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json();DATA=x.days||{};$('status').textContent='live · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render()}catch(e){$('status').textContent='sync error';console.error(e)}}render();refresh();setInterval(refresh,15000);</script></body></html>
