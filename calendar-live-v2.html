<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combined Calendar</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#eff8fd}.card{border:1px solid rgba(198,226,255,.19);border-radius:22px;padding:15px;background:radial-gradient(circle at 10% 0%,rgba(126,191,232,.11),transparent 28%),linear-gradient(155deg,rgba(6,18,31,.97),rgba(4,11,22,.97));box-shadow:0 14px 36px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#8eb0c4;font-weight:750}.title{font-size:18px;font-weight:790;letter-spacing:-.02em;margin-top:2px}.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.nav,.filter{appearance:none;border:1px solid rgba(218,235,247,.15);background:rgba(137,177,202,.06);color:#cfe0ea;border-radius:9px;min-height:30px;padding:0 9px;font:700 9px Inter,system-ui;cursor:pointer}.nav{width:31px;padding:0;font-size:15px}.filter.on{background:rgba(153,202,235,.18);border-color:rgba(192,224,246,.42);color:#fff}.main{display:grid;grid-template-columns:minmax(0,1fr) 218px;gap:12px;margin-top:13px}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays{font-size:8px;color:#7590a0;text-align:center;margin-bottom:5px}.day{appearance:none;text-align:left;min-height:91px;border:1px solid rgba(213,232,245,.09);border-radius:10px;background:rgba(114,154,180,.035);padding:6px;overflow:hidden;color:inherit;cursor:pointer}.day:hover,.day.selected{border-color:rgba(205,229,246,.32);background:rgba(122,172,204,.08)}.day.out{opacity:.25}.day.today{outline:1px solid rgba(220,240,255,.65);outline-offset:1px}.num{font-size:9px;font-weight:760;color:#9db3c0;margin-bottom:5px}.chips{display:grid;gap:3px}.chip{font-size:7px;line-height:1.15;border-radius:5px;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}.chip.task{background:rgba(69,137,199,.24);border-color:rgba(109,176,232,.20);color:#cbe8ff}.chip.event{background:rgba(174,64,74,.24);border-color:rgba(235,126,132,.18);color:#ffd6d8}.chip.class{background:rgba(83,157,175,.21);border-color:rgba(145,210,222,.18);color:#d3f6fb}.chip.break{background:rgba(76,146,103,.22);border-color:rgba(135,205,157,.18);color:#d7f5df}.chip.personal{background:rgba(137,122,163,.20);border-color:rgba(190,171,222,.16);color:#e9dcff}.more{font-size:7px;color:#7e98a7;padding-left:2px}.details{border:1px solid rgba(213,232,245,.10);border-radius:13px;background:rgba(6,15,27,.44);padding:11px;min-width:0}.details-title{font-size:11px;font-weight:780}.details-date{font-size:8px;color:#829baa;margin-top:2px}.list{display:grid;gap:7px;margin-top:10px}.item{display:block;text-decoration:none;color:inherit;border-left:2px solid #6faee1;padding:2px 0 2px 7px;min-width:0}.item.event{border-color:#d36a73}.item.class{border-color:#72bac9}.item.break{border-color:#79bc8e}.item.personal{border-color:#9a86ba}.item:hover .item-name{text-decoration:underline}.item-name{font-size:9px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{font-size:7px;color:#839aa8;margin-top:3px}.empty{font-size:8px;color:#708997;margin-top:11px}.legend{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:7px;color:#78909e;margin-top:10px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}.d1{background:#5c9ad0}.d2{background:#c65c66}.d3{background:#68aebc}.d4{background:#6dac82}.status{margin-left:auto}.monthLabel{min-width:112px;text-align:center;font-size:10px;font-weight:760}@media(max-width:700px){.main{grid-template-columns:1fr}.details{min-height:100px}.day{min-height:80px;padding:4px}.chip{font-size:6.5px}.card{padding:12px}}@media(max-width:470px){.day{min-height:62px}.chip{display:none}.more{display:block}.main{gap:8px}}</style></head><body><section class="card"><div class="top"><div><div class="eyebrow">Unified calendar</div><div class="title">Assignments + events</div></div><div class="controls"><button class="nav" id="prev" aria-label="Previous month">‹</button><div class="monthLabel" id="monthLabel"></div><button class="nav" id="next" aria-label="Next month">›</button><button class="filter on" data-filter="both">Both</button><button class="filter" data-filter="tasks">Assignments</button><button class="filter" data-filter="events">Events</button></div></div><div class="main"><div><div class="weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="grid" id="grid"></div><div class="legend"><span><i class="dot d1"></i>Assignments</span><span><i class="dot d2"></i>Events</span><span><i class="dot d3"></i>Classes</span><span><i class="dot d4"></i>Breaks</span><span class="status" id="status">connecting…</span></div></div><aside class="details"><div class="details-title" id="detailTitle">Select a day</div><div class="details-date" id="detailDate"></div><div class="list" id="detailList"></div></aside></div></section><script>const TZ='America/Indiana/Indianapolis',DAY=86400000,API='/api/calendar-data';let MAP={},FILTER='both';const $=id=>document.getElementById(id);function p(){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}const tp=p();let YEAR=+tp.year,MONTH=+tp.month-1,SELECTED=`${tp.year}-${tp.month}-${tp.day}`;function iso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function parseDay(s){const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}function localKey(v){if(!v)return'';if(v.length===10)return v;const dt=new Date(v),x=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(dt).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}`}function put(k,item){if(k)(MAP[k]||(MAP[k]=[])).push(item)}function rebuild(data){MAP={};(data.assignments||[]).forEach(x=>put(localKey(x.at),{...x,kind:'task'}));(data.events||[]).forEach(x=>{const kind=x.type==='Class'?'class':x.type==='Break'?'break':x.category==='Personal'?'personal':'event',start=localKey(x.at),end=localKey(x.end)||start;if(!start)return;let a=parseDay(start),b=parseDay(end);if(b<a)b=a;const cap=Math.min(b,a+31*DAY);for(let t=a;t<=cap;t+=DAY)put(new Date(t).toISOString().slice(0,10),{...x,kind})})}function itemsFor(k){return (MAP[k]||[]).filter(x=>FILTER==='both'||(FILTER==='tasks'&&x.kind==='task')||(FILTER==='events'&&x.kind!=='task'))}function fmtAt(v){if(!v||v.length===10)return'';const d=new Date(v);return Number.isFinite(d.getTime())?new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).format(d):''}function renderDetail(k){const[y,m,d]=k.split('-').map(Number),items=itemsFor(k);$('detailTitle').textContent=items.length?`${items.length} item${items.length===1?'':'s'}`:'No scheduled items';$('detailDate').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',month:'long',day:'numeric'}).format(new Date(Date.UTC(y,m-1,d)));$('detailList').innerHTML='';if(!items.length){$('detailList').innerHTML='<div class="empty">Nothing from the current filter on this date.</div>';return}items.forEach(x=>{const href=x.source||x.notion_url||'#',el=document.createElement(href==='#'?'div':'a');el.className='item '+x.kind;if(href!=='#'){el.href=href;el.target='_blank';el.rel='noopener noreferrer'}const n=document.createElement('div');n.className='item-name';n.textContent=x.name||'Untitled';const meta=document.createElement('div');meta.className='item-meta';meta.textContent=[x.course,x.type,fmtAt(x.at),x.info].filter(Boolean).join(' · ');el.append(n,meta);$('detailList').appendChild(el)})}function render(){const first=new Date(Date.UTC(YEAR,MONTH,1)),days=new Date(Date.UTC(YEAR,MONTH+1,0)).getUTCDate(),lead=(first.getUTCDay()+6)%7,total=Math.ceil((lead+days)/7)*7;$('monthLabel').textContent=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(first);$('grid').innerHTML='';for(let i=0;i<total;i++){const dateNum=i-lead+1,dt=new Date(Date.UTC(YEAR,MONTH,dateNum)),y=dt.getUTCFullYear(),m=dt.getUTCMonth(),d=dt.getUTCDate(),k=iso(y,m,d),items=itemsFor(k),b=document.createElement('button');b.className='day'+(m!==MONTH?' out':'')+(k===SELECTED?' selected':'')+(k===`${tp.year}-${tp.month}-${tp.day}`?' today':'');const num=document.createElement('div');num.className='num';num.textContent=d;const chips=document.createElement('div');chips.className='chips';items.slice(0,3).forEach(x=>{const c=document.createElement('div');c.className='chip '+x.kind;c.textContent=x.name||'Untitled';chips.appendChild(c)});if(items.length>3){const more=document.createElement('div');more.className='more';more.textContent='+'+(items.length-3)+' more';chips.appendChild(more)}b.append(num,chips);b.onclick=()=>{SELECTED=k;render();renderDetail(k)};$('grid').appendChild(b)}renderDetail(SELECTED)}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{FILTER=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));render()});$('prev').onclick=()=>{MONTH--;if(MONTH<0){MONTH=11;YEAR--}SELECTED=iso(YEAR,MONTH,1);render()};$('next').onclick=()=>{MONTH++;if(MONTH>11){MONTH=0;YEAR++}SELECTED=iso(YEAR,MONTH,1);render()};async function refresh(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const data=await r.json();rebuild(data);$('status').textContent='Notion + Google live';render()}catch(e){$('status').textContent='sync error';console.error(e)}}render();refresh();setInterval(refresh,15000);</script></body></html>
