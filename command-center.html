<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean Command Center</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f5fbff}
body{padding:0}
.card{position:relative;overflow:hidden;border:1px solid rgba(226,239,255,.30);border-radius:23px;padding:16px;background:linear-gradient(180deg,rgba(3,8,18,.36),rgba(4,8,18,.72)),url('./blood%20kelp%20zone.png') 50% 52%/cover no-repeat;box-shadow:0 18px 44px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08);min-height:448px}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 3%,rgba(157,213,255,.13),transparent 27%),radial-gradient(circle at 86% 20%,rgba(255,92,111,.09),transparent 28%),linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.14))}
.card>*{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.eyebrow{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#b7cedd;font-weight:750;text-shadow:0 1px 5px #000}.place{font-size:11px;font-weight:720;margin-top:3px;color:#dbe9f2}.clock{text-align:right;font-variant-numeric:tabular-nums}.time{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1;text-shadow:0 2px 8px #000}.date{font-size:8px;color:#a9becb;margin-top:4px}
.weather{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;margin-top:14px}.wicon{font-size:34px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}.temp{font-size:37px;font-weight:820;letter-spacing:-.055em;line-height:.95}.cond{font-size:10px;color:#c4d6e0;margin-top:5px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}.metric{background:rgba(4,12,23,.46);border:1px solid rgba(226,239,255,.15);border-radius:10px;padding:7px 4px;text-align:center;backdrop-filter:blur(2px)}.ml{font-size:6.5px;letter-spacing:.07em;text-transform:uppercase;color:#91a9b8}.mv{font-size:9.5px;font-weight:760;margin-top:3px;white-space:nowrap}
.divider{height:1px;background:rgba(255,255,255,.12);margin:14px 0 12px}.progress-zone{display:grid;grid-template-columns:92px minmax(0,1fr);gap:13px;align-items:center}.hex-wrap{position:relative;width:84px;height:84px;margin:auto}.hex{width:84px;height:84px;transform:rotate(-90deg);overflow:visible}.hex .base{fill:rgba(3,11,20,.52);stroke:rgba(224,239,255,.20);stroke-width:5}.hex .prog{fill:none;stroke:#a7d8f8;stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 4px rgba(132,203,248,.26));transition:stroke-dashoffset .5s ease}.hex-text{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.hex-pct{font-size:17px;font-weight:820}.hex-lab{font-size:6.5px;color:#a7bdca;text-transform:uppercase;letter-spacing:.08em;margin-top:-17px}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}.bar-name{font-size:8.5px;font-weight:720}.bar-meta{font-size:7px;color:#9cb2bf;text-align:right}.track{grid-column:1/-1;height:9px;border:1px solid rgba(225,239,255,.34);border-radius:999px;padding:2px;background:rgba(3,10,19,.38)}.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,rgba(131,202,244,.86),rgba(211,232,255,.95));transition:width .5s ease}.fill.break{background:linear-gradient(90deg,rgba(217,98,105,.72),rgba(255,174,159,.95))}.fill.college{background:linear-gradient(90deg,rgba(151,135,218,.76),rgba(217,203,255,.96))}
.nexts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.next{border:1px solid rgba(226,239,255,.15);border-radius:12px;background:rgba(4,12,23,.49);padding:9px 10px;min-width:0;backdrop-filter:blur(2px)}.next-name{font-size:10px;font-weight:770;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-meta{font-size:7.5px;color:#9eb3c0;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-size:9px;color:#e3f2fa;margin-top:5px;font-weight:730}.status{font-size:6.5px;color:#839ba9;margin-top:8px;text-align:right}
@media(max-width:360px){.card{padding:13px}.metrics{grid-template-columns:repeat(2,1fr)}.progress-zone{grid-template-columns:80px 1fr}.hex,.hex-wrap{width:72px;height:72px}.nexts{grid-template-columns:1fr}.time{font-size:22px}}
</style>
</head>
<body>
<section class="card">
  <div class="top">
    <div><div class="eyebrow">Command center</div><div class="place">West Lafayette · Fall 2026</div></div>
    <div class="clock"><div class="time" id="clock">--:--:--</div><div class="date" id="dateLine"></div></div>
  </div>
  <div class="weather">
    <div class="wicon" id="wicon">◌</div>
    <div><div class="temp" id="temp">--°</div><div class="cond" id="cond">Loading weather…</div></div>
  </div>
  <div class="metrics">
    <div class="metric"><div class="ml">Feels like</div><div class="mv" id="feels">--°</div></div>
    <div class="metric"><div class="ml">High / low</div><div class="mv" id="hilo">-- / --</div></div>
    <div class="metric"><div class="ml">Humidity</div><div class="mv" id="humidity">--%</div></div>
    <div class="metric"><div class="ml">Precip · 6h</div><div class="mv" id="precip">--%</div></div>
  </div>
  <div class="divider"></div>
  <div class="progress-zone">
    <div class="hex-wrap">
      <svg class="hex" viewBox="0 0 100 100" aria-label="Semester progress"><polygon class="base" points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"/><polygon class="prog" id="semStroke" pathLength="100" points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"/></svg>
      <div class="hex-text"><div><div class="hex-pct" id="semPct">--%</div><div class="hex-lab">semester</div></div></div>
    </div>
    <div class="bars">
      <div class="bar-row"><div class="bar-name" id="breakName">Next break</div><div class="bar-meta" id="breakMeta">—</div><div class="track"><div class="fill break" id="breakFill"></div></div></div>
      <div class="bar-row"><div class="bar-name">College · 4-year horizon</div><div class="bar-meta" id="collegeMeta">—</div><div class="track"><div class="fill college" id="collegeFill"></div></div></div>
    </div>
  </div>
  <div class="nexts">
    <div class="next"><div class="eyebrow">Next class</div><div class="next-name" id="className">Loading…</div><div class="next-meta" id="classMeta"></div><div class="count" id="classCount">—</div></div>
    <div class="next"><div class="eyebrow">Next exam</div><div class="next-name" id="examName">Loading…</div><div class="next-meta" id="examMeta"></div><div class="count" id="examCount">—</div></div>
  </div>
  <div class="status" id="status">connecting to Notion…</div>
</section>
<script>
const TZ='America/Indiana/Indianapolis',DAY=86400000,API='/api/dashboard?scope=academics';
const SEM_START='2026-08-24',SEM_END='2026-12-20',COLLEGE_START='2026-08-24',COLLEGE_END='2030-05-12';
const FALLBACK_BREAKS=[{name:'Fall Break',start:'2026-10-12',end:'2026-10-14'},{name:'Thanksgiving Break',start:'2026-11-25',end:'2026-11-30'},{name:'Winter Break',start:'2026-12-20',end:'2027-01-11'}];
const WEEKLY=[{d:1,h:8,m:30,n:'MFET 163',r:'BHEE 129'},{d:1,h:9,m:30,n:'ENGR 161',r:'SHRV C111'},{d:1,h:12,m:30,n:'MA 261',r:'CL50 224'},{d:2,h:15,m:30,n:'MA 261 Recitation',r:'PHYS 202'},{d:3,h:7,m:30,n:'CS 159',r:'LWSN B155'},{d:3,h:9,m:30,n:'ENGR 161',r:'SHRV C111'},{d:3,h:12,m:30,n:'MA 261',r:'CL50 224'},{d:4,h:7,m:30,n:'MFET 163 Lab',r:'PHYS 022'},{d:4,h:11,m:30,n:'CS 159 Lab',r:'MTHW 301'},{d:5,h:7,m:30,n:'CS 159',r:'LWSN B155'},{d:5,h:9,m:30,n:'ENGR 161',r:'SHRV C111'},{d:5,h:12,m:30,n:'MA 261',r:'CL50 224'}];
const BLOCKED=new Set(['2026-10-12','2026-10-13','2026-11-25','2026-11-26','2026-11-27']);
let DATA={events:{}};const $=id=>document.getElementById(id);
function tzParts(now=new Date()){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'}).formatToParts(now).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}
function localUtcMs(now=new Date()){const p=tzParts(now);return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)}
function dayMs(s){const[y,m,d]=s.slice(0,10).split('-').map(Number);return Date.UTC(y,m-1,d)}
function key(ms){return new Date(ms).toISOString().slice(0,10)}
function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function pctBetween(now,start,end){return clamp((now-start)/(end-start))*100}
function human(ms){if(ms<=0)return'now';const mins=Math.floor(ms/60000);if(mins<60)return mins+'m';const h=Math.floor(mins/60);if(h<24)return h+'h '+(mins%60)+'m';const d=Math.floor(h/24);return d+'d '+(h%24)+'h'}
function fmtDateTime(ms){return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(ms))}
function eventMs(e){if(!e?.at)return 0;if(e.at.length===10)return dayMs(e.at)+12*3600000;const t=new Date(e.at).getTime();return Number.isFinite(t)?t:0}
function allEvents(){return Object.values(DATA.events||{}).flat()}
function updateClock(){const n=new Date();$('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',second:'2-digit'}).format(n);$('dateLine').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'short',day:'numeric'}).format(n)}
function renderProgress(){const n=localUtcMs(),sem=pctBetween(n,dayMs(SEM_START),dayMs(SEM_END));$('semPct').textContent=Math.round(sem)+'%';$('semStroke').style.strokeDashoffset=String(100-sem);
  const liveBreaks=allEvents().filter(e=>e.type==='Break'&&eventMs(e)>n).map(e=>({name:e.name||'Break',start:key(eventMs(e)),end:key(eventMs(e)+DAY)})).sort((a,b)=>dayMs(a.start)-dayMs(b.start));
  const breaks=[...liveBreaks,...FALLBACK_BREAKS].filter((b,i,a)=>a.findIndex(x=>x.start===b.start)===i).sort((a,b)=>dayMs(a.start)-dayMs(b.start));
  const next=breaks.find(b=>dayMs(b.start)>n)||FALLBACK_BREAKS[FALLBACK_BREAKS.length-1];let anchor=dayMs(SEM_START);for(const b of breaks){if(dayMs(b.end)<=n)anchor=Math.max(anchor,dayMs(b.end))}const bp=pctBetween(n,anchor,dayMs(next.start));$('breakName').textContent=next.name;$('breakMeta').textContent=human(dayMs(next.start)-n);$('breakFill').style.width=bp.toFixed(1)+'%';
  const cp=pctBetween(n,dayMs(COLLEGE_START),dayMs(COLLEGE_END));$('collegeFill').style.width=cp.toFixed(1)+'%';$('collegeMeta').textContent=cp.toFixed(1)+'%';
}
function fallbackClass(){const n=localUtcMs(),base=new Date(n),mid=Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate());let arr=[];for(let i=0;i<12;i++){const dm=mid+i*DAY,k=key(dm);if(BLOCKED.has(k))continue;const dow=new Date(dm).getUTCDay();WEEKLY.filter(c=>c.d===dow).forEach(c=>arr.push({...c,s:dm+c.h*3600000+c.m*60000}))}return arr.sort((a,b)=>a.s-b.s).find(x=>x.s>n)}
function renderNext(){const now=Date.now();const classes=allEvents().filter(e=>e.type==='Class'&&eventMs(e)>now).sort((a,b)=>eventMs(a)-eventMs(b));if(classes.length){const x=classes[0],t=eventMs(x);$('className').textContent=x.name;$('classMeta').textContent=(x.course?x.course+' · ':'')+fmtDateTime(t);$('classCount').textContent='in '+human(t-now)}else{const x=fallbackClass();if(x){$('className').textContent=x.n;$('classMeta').textContent=fmtDateTime(x.s)+' · '+x.r;$('classCount').textContent='in '+human(x.s-localUtcMs())}else{$('className').textContent='No class queued';$('classMeta').textContent='';$('classCount').textContent='—'}}
  const exams=allEvents().filter(e=>e.type==='Exam'&&eventMs(e)>now).sort((a,b)=>eventMs(a)-eventMs(b));if(exams.length){const x=exams[0],t=eventMs(x);$('examName').textContent=x.name;$('examMeta').textContent=(x.course?x.course+' · ':'')+fmtDateTime(t);$('examCount').textContent='in '+human(t-now)}else{$('examName').textContent='No exam scheduled';$('examMeta').textContent='';$('examCount').textContent='—'}
}
const WMO={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],61:['🌦️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorms'],96:['⛈️','Storm + hail'],99:['⛈️','Storm + hail']};
const WEATHER='https://api.open-meteo.com/v1/forecast?latitude=40.4237&longitude=-86.9212&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&hourly=precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FIndiana%2FIndianapolis&forecast_days=2';
async function loadWeather(){try{const r=await fetch(WEATHER,{cache:'no-store'});if(!r.ok)throw new Error();const w=await r.json(),c=w.current||{},d=w.daily||{},h=w.hourly||{},desc=WMO[c.weather_code]||['🌊','Current conditions'];$('wicon').textContent=desc[0];$('temp').textContent=Math.round(c.temperature_2m)+'°';$('cond').textContent=desc[1]+' · today precip '+Math.round(d.precipitation_probability_max?.[0]||0)+'%';$('feels').textContent=Math.round(c.apparent_temperature)+'°';$('hilo').textContent=Math.round(d.temperature_2m_max?.[0])+'° / '+Math.round(d.temperature_2m_min?.[0])+'°';$('humidity').textContent=Math.round(c.relative_humidity_2m)+'%';let idx=(h.time||[]).findIndex(t=>new Date(t).getTime()>=Date.now());if(idx<0)idx=0;const vals=(h.precipitation_probability||[]).slice(idx,idx+6);$('precip').textContent=Math.round(vals.length?Math.max(...vals):d.precipitation_probability_max?.[0]||0)+'%'}catch(e){$('cond').textContent='Weather unavailable';$('wicon').textContent='◌'}}
async function refresh(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);DATA=await r.json();$('status').textContent='Notion live · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});renderNext();renderProgress()}catch(e){$('status').textContent='Notion sync error';console.error(e)}}
updateClock();renderProgress();renderNext();loadWeather();refresh();setInterval(updateClock,1000);setInterval(()=>{renderProgress();renderNext()},15000);setInterval(refresh,15000);setInterval(loadWeather,20*60000);
</script>
</body>
</html>
