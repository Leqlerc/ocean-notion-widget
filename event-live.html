<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}.panel{position:relative;overflow:hidden;height:188px;border:1px solid rgba(198,226,255,.22);border-radius:20px;padding:11px 12px 10px;background:radial-gradient(circle at 12% 4%,rgba(255,173,173,.11),transparent 34%),radial-gradient(circle at 88% 16%,rgba(205,194,255,.08),transparent 34%),linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05)}.panel:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;bottom:-85px;background:rgba(255,177,177,.05);filter:blur(18px);pointer-events:none}.eyebrow{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#c99292;font-weight:700}.sem-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:6px}.sem-title{font-size:11px;font-weight:760}.sem-sub{font-size:7.5px;color:#8f777d}.months{display:grid;grid-template-columns:18px repeat(17,minmax(0,1fr));gap:3px;margin-bottom:4px;font-size:7px;color:#8e7378}.gridrow{display:grid;grid-template-columns:18px 1fr;gap:4px}.days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:7px;color:#8b7377;line-height:11px;text-align:center}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:minmax(0,1fr);gap:3px}.cell{height:11px;border-radius:2.5px;border:1px solid rgba(255,255,255,.10);background:#56606b;opacity:.42}.cell.outside{opacity:.10}.cell.today{outline:1px solid rgba(255,255,255,.88);outline-offset:1px}.cell.l1{background:#d89b9b;opacity:.95}.cell.l2{background:#b55a5e;opacity:.97}.cell.l3{background:#87313a;opacity:1}.cell.l4{background:#5b151e;opacity:1}.cell.l5{background:#280509;opacity:1}.sem-foot{display:flex;justify-content:space-between;gap:8px;margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.055);font-size:7px;color:#826c70}.legend{display:flex;gap:4px}.sw{width:8px;height:8px;border-radius:2px}.s0{background:#56606b}.s1{background:#d89b9b}.s2{background:#b55a5e}.s3{background:#87313a}.s4{background:#5b151e}.s5{background:#280509}.status{position:absolute;right:12px;top:12px;font-size:6.5px;color:#8f777d}</style></head><body><section class="panel"><div class="sem-head"><div><div class="eyebrow">Event workload</div><div class="sem-title">Fall 2026 academic events</div></div><div class="sem-sub">weeks →</div></div><div class="months" id="months"></div><div class="gridrow"><div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="heat" id="heat"></div></div><div class="sem-foot"><span>Light = meetup/quiz · dark = roundtable/practical/exam</span><span class="legend"><i class="sw s0"></i><i class="sw s1"></i><i class="sw s2"></i><i class="sw s3"></i><i class="sw s4"></i><i class="sw s5"></i></span></div><div class="status" id="status">connecting…</div></section><script>const TZ='America/Indiana/Indianapolis',DAY=86400000,START='2026-08-24',END='2026-12-19',API='/api/dashboard?scope=academics';const WEIGHT={Meetup:1,Other:1,Quiz:2,CFU:2,Presentation:3,Demonstration:3,Roundtable:4,Practical:4,Exam:5};let EVENTS={};const $=id=>document.getElementById(id);function parts(){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}function nowLocal(){const p=parts();return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)}function key(ms){return new Date(ms).toISOString().slice(0,10)}function dateMs(s){const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)}function monday(ms){const d=new Date(ms).getUTCDay();return ms-((d+6)%7)*DAY}function level(items){if(!items.length)return 0;return Math.min(5,Math.max(...items.map(e=>WEIGHT[e.type]||1))+items.length-1)}function render(){const start=dateMs(START),end=dateMs(END),gs=monday(start),today=key(nowLocal());$('months').innerHTML='<span></span>';$('heat').innerHTML='';let lm=-1;for(let w=0;w<17;w++){const ms=gs+w*7*DAY,m=new Date(ms).getUTCMonth(),s=document.createElement('span');if(m!==lm){s.textContent=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(new Date(ms));lm=m}$('months').appendChild(s)}for(let w=0;w<17;w++)for(let d=0;d<7;d++){const ms=gs+(w*7+d)*DAY,k=key(ms),items=EVENTS[k]||[],lv=level(items),c=document.createElement('div');c.className='cell'+(lv?' l'+lv:'');if(ms<start||ms>end)c.classList.add('outside');if(k===today)c.classList.add('today');c.title=k+' · '+items.length+' event'+(items.length===1?'':'s')+(lv?' · intensity '+lv+'/5':'')+(items.length?' · '+items.map(e=>e.name+' ['+e.type+']').join(' • '):'');$('heat').appendChild(c)}}async function refresh(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();EVENTS=data.events||{};$('status').textContent='live · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render()}catch(e){$('status').textContent='sync error';console.error(e)}}render();refresh();setInterval(refresh,15000);</script></body></html>
