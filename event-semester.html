<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}.panel{position:relative;overflow:hidden;height:188px;border:1px solid rgba(198,226,255,.22);border-radius:20px;padding:11px 12px 10px;background:radial-gradient(circle at 12% 4%,rgba(255,173,173,.11),transparent 34%),radial-gradient(circle at 88% 16%,rgba(205,194,255,.08),transparent 34%),linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05)}.panel:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;bottom:-85px;background:rgba(255,177,177,.05);filter:blur(18px);pointer-events:none}.eyebrow{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#c99292;font-weight:700}.sem-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:6px}.sem-title{font-size:11px;font-weight:760;letter-spacing:-.01em}.sem-sub{font-size:7.5px;color:#8f777d}.heat-wrap{position:relative;z-index:1}.months{display:grid;grid-template-columns:18px repeat(17,minmax(0,1fr));gap:3px;margin-bottom:4px;font-size:7px;color:#8e7378;line-height:1}.month{white-space:nowrap;overflow:visible}.gridrow{display:grid;grid-template-columns:18px 1fr;gap:4px}.days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:7px;color:#8b7377;line-height:11px;text-align:center}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:minmax(0,1fr);gap:3px}.cell{height:11px;border-radius:2.5px;border:1px solid rgba(255,255,255,.10);background:#56606b;opacity:.42;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:transform .12s ease,border-color .12s ease,opacity .12s ease}.cell:hover{transform:scale(1.22);border-color:rgba(255,255,255,.65);opacity:1;z-index:3}.cell.outside{opacity:.10}.cell.today{outline:1px solid rgba(255,255,255,.88);outline-offset:1px}.cell.l1{background:#d89b9b;opacity:.95}.cell.l2{background:#b55a5e;opacity:.97}.cell.l3{background:#87313a;opacity:1}.cell.l4{background:#5b151e;opacity:1}.cell.l5{background:#280509;opacity:1;box-shadow:0 0 8px rgba(124,23,32,.22),inset 0 1px 0 rgba(255,255,255,.05)}.sem-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.055);font-size:7px;color:#826c70;position:relative;z-index:1}.legend{display:flex;align-items:center;gap:4px}.sw{width:8px;height:8px;border-radius:2px;border:1px solid rgba(255,255,255,.10)}.s0{background:#56606b;opacity:.42}.s1{background:#d89b9b}.s2{background:#b55a5e}.s3{background:#87313a}.s4{background:#5b151e}.s5{background:#280509}</style></head><body><section class="panel"><div class="sem-head"><div><div class="eyebrow">Event workload</div><div class="sem-title">Fall 2026 academic events</div></div><div class="sem-sub">weeks →</div></div><div class="heat-wrap"><div class="months" id="months"></div><div class="gridrow"><div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="heat" id="heat"></div></div></div><div class="sem-foot"><span>Light = meetup/quiz · dark = roundtable/practical/exam</span><span class="legend"><i class="sw s0"></i><i class="sw s1"></i><i class="sw s2"></i><i class="sw s3"></i><i class="sw s4"></i><i class="sw s5"></i></span></div></section><script>const TZ='America/Indiana/Indianapolis',DAY=86400000,SEM_START='2026-08-24',SEM_END='2026-12-19';const WEIGHT={Meetup:1,Other:1,Quiz:2,CFU:2,Presentation:3,Demonstration:3,Roundtable:4,Practical:4,Exam:5};const LOAD={'2026-09-10':{events:[{type:'Quiz',name:'CS 159 — Lab Quiz 2'}]},'2026-09-11':{events:[{type:'CFU',name:'ENGR 161 — CFU #1'}]},'2026-09-15':{events:[{type:'Quiz',name:'MA 261 — Recitation Quiz 3'}]},'2026-09-22':{events:[{type:'Quiz',name:'MA 261 — Recitation Quiz 4'}]},'2026-09-28':{events:[{type:'Exam',name:'ENGR 161 — Exam #1'}]},'2026-09-29':{events:[{type:'Quiz',name:'MA 261 — Recitation Quiz 5'}]},'2026-10-05':{events:[{type:'Exam',name:'MA 261 — Midterm Exam 1'}]},'2026-10-09':{events:[{type:'Exam',name:'MFET 163 — Exam 1 Due'}]},'2026-10-15':{events:[{type:'Practical',name:'MFET 163 — Practical 1'},{type:'Exam',name:'CS 159 — Midterm Exam 1'}]},'2026-10-20':{events:[{type:'Quiz',name:'MA 261 — Recitation Quiz 6'}]},'2026-10-21':{events:[{type:'CFU',name:'ENGR 161 — CFU #2'}]},'2026-10-27':{events:[{type:'Quiz',name:'MA 261 — Recitation Quiz 7'}]},'2026-10-28':{events:[{type:'Exam',name:'ENGR 161 — Exam #2'}]},'2026-11-03':{events:[{type:'Quiz',name:'MA 261 — Recitation Quiz 8'}]},'2026-11-10':{events:[{type:'Quiz',name:'MA 261 — Recitation Quiz 9'}]},'2026-11-17':{events:[{type:'Exam',name:'CS 159 — Midterm Exam 2'}]},'2026-11-18':{events:[{type:'CFU',name:'ENGR 161 — CFU #3'},{type:'Exam',name:'MA 261 — Midterm Exam 2'}]},'2026-11-27':{events:[{type:'Exam',name:'MFET 163 — Exam 2 Due'}]},'2026-12-01':{events:[{type:'Quiz',name:'MA 261 — Recitation Quiz 10'}]},'2026-12-02':{events:[{type:'Exam',name:'ENGR 161 — Exam #3'}]},'2026-12-10':{events:[{type:'Practical',name:'MFET 163 — Practical 2'}]}};function p(){const f=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'});return Object.fromEntries(f.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}function nowLocal(){const x=p();return Date.UTC(+x.year,+x.month-1,+x.day,+x.hour,+x.minute,+x.second)}function key(ms){return new Date(ms).toISOString().slice(0,10)}function dateMs(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}function monday(ms){const dow=new Date(ms).getUTCDay();return ms-((dow+6)%7)*DAY}function level(v){const events=v?.events||[];if(!events.length)return 0;const base=Math.max(...events.map(e=>WEIGHT[e.type]||1));return Math.min(5,base+Math.max(0,events.length-1))}function render(){const start=dateMs(SEM_START),end=dateMs(SEM_END),gridStart=monday(start),weeks=17,today=key(nowLocal()),months=document.getElementById('months'),heat=document.getElementById('heat');months.innerHTML='<span></span>';heat.innerHTML='';let lastMonth=-1;for(let w=0;w<weeks;w++){const ms=gridStart+w*7*DAY,dt=new Date(ms),m=dt.getUTCMonth(),s=document.createElement('span');s.className='month';if(m!==lastMonth){s.textContent=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(dt);lastMonth=m}months.appendChild(s)}for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const ms=gridStart+(w*7+d)*DAY,k=key(ms),v=LOAD[k]||{events:[]},events=v.events||[],c=document.createElement('div'),lv=level(v);c.className='cell'+(lv?' l'+lv:'');if(ms<start||ms>end)c.classList.add('outside');if(k===today)c.classList.add('today');const names=events.map(e=>e.name+' ['+e.type+']').join(' • ');c.title=k+' · '+events.length+' event'+(events.length===1?'':'s')+(lv?' · intensity '+lv+'/5':'')+(names?' · '+names:'');heat.appendChild(c)}}render();setInterval(render,300000);</script></body></html>
