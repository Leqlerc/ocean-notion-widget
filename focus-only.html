<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}.card{position:relative;overflow:hidden;border:1px solid rgba(198,226,255,.20);border-radius:18px;padding:13px 14px;background:linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 12px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px}.eyebrow{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#8fb5cb;font-weight:700}.title{font-size:14px;font-weight:760;margin-top:2px}.count{font-size:9px;color:#7f98a8;font-variant-numeric:tabular-nums}.list{display:grid;gap:7px;margin-top:10px}.row{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:7px}.check{appearance:none;width:24px;height:24px;border-radius:8px;border:1px solid rgba(207,229,243,.18);background:rgba(143,178,202,.07);cursor:pointer;position:relative}.check.on{background:linear-gradient(145deg,#d8ccff,#a9c8f2);border-color:rgba(229,220,255,.65)}.check.on:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#16232d;font-size:13px;font-weight:900}.input{width:100%;border:1px solid rgba(211,230,243,.10);border-radius:9px;background:rgba(143,178,202,.05);color:#dfeef7;padding:7px 8px;font:600 10px/1.2 Inter,ui-sans-serif,system-ui;outline:none}.input:focus{border-color:rgba(190,220,255,.30)}.row.done .input{color:#718796;text-decoration:line-through}.foot{font-size:7px;color:#587183;margin-top:8px;text-align:right}</style></head><body><section class="card"><div class="head"><div><div class="eyebrow">Daily focus</div><div class="title">Top 3</div></div><div class="count" id="count">0 / 3</div></div><div class="list" id="list"></div><div class="foot">resets each day · saved on this device</div></section><script>const TZ='America/Indiana/Indianapolis';function key(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return `ocean-daily-focus-v1-${p.year}-${p.month}-${p.day}`}let data=[{text:'',done:false},{text:'',done:false},{text:'',done:false}];try{const x=JSON.parse(localStorage.getItem(key()));if(Array.isArray(x)&&x.length===3)data=x}catch(e){}function save(){try{localStorage.setItem(key(),JSON.stringify(data))}catch(e){}}function render(){const root=document.getElementById('list');root.innerHTML='';data.forEach((item,i)=>{const row=document.createElement('div');row.className='row'+(item.done?' done':'');const b=document.createElement('button');b.className='check'+(item.done?' on':'');b.setAttribute('aria-label','Complete focus item');b.onclick=()=>{data[i].done=!data[i].done;save();render()};const input=document.createElement('input');input.className='input';input.value=item.text;input.placeholder=`Focus ${i+1}`;input.maxLength=80;input.oninput=()=>{data[i].text=input.value;save()};row.append(b,input);root.appendChild(row)});document.getElementById('count').textContent=data.filter(x=>x.done).length+' / 3'}render();</script></body></html>
