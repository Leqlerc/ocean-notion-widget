<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 15%,#0d2b45 0,#07131f 45%,#03070d 100%);min-height:100vh;padding:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#eaf7ff}.card{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:20px 20px 18px;background:linear-gradient(145deg,rgba(19,45,68,.56),rgba(8,20,35,.34));backdrop-filter:blur(20px) saturate(145%);-webkit-backdrop-filter:blur(20px) saturate(145%);box-shadow:0 22px 55px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.13),inset 0 -1px 0 rgba(255,255,255,.04)}.glow{position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(0,194,255,.08);filter:blur(20px);pointer-events:none}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#bdeeff}.clock{font-size:34px;line-height:1;font-weight:700;letter-spacing:-.04em}.date{margin-top:5px;font-size:12px;color:#8daec1}.zone{font-size:11px;color:#a9c6d8;text-align:right}.row{margin-top:13px}.meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.label{font-size:12px;font-weight:650;letter-spacing:.01em}.pct{font-size:12px;color:#9fdfff;font-variant-numeric:tabular-nums}.track{height:17px;border-radius:999px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 2px 7px rgba(0,0,0,.25);overflow:hidden}.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#2dd4ff,#5ba8ff 48%,#7c83ff);box-shadow:0 0 18px rgba(52,194,255,.42);transition:width .6s ease}.semester .fill{background:linear-gradient(90deg,#34f5ff,#43c7ff 50%,#5a8dff 100%)}.week .fill{background:linear-gradient(90deg,#7bffb2,#2ee6c9 52%,#19c7ff 100%)}.month .fill{background:linear-gradient(90deg,#ffd86a,#ff9f68 48%,#ff7dc2 100%)}.year .fill{background:linear-gradient(90deg,#7b7cff,#9a6dff 55%,#d86bff 100%)}.foot{display:flex;justify-content:space-between;margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.05);font-size:10.5px;color:#6f91a7}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4edcff;box-shadow:0 0 10px rgba(78,220,255,.8);margin-right:6px;vertical-align:1px}</style></head><body><div class="card"><div class="glow"></div><div class="top"><div><div class="eyebrow">Ocean dashboard</div><div class="clock" id="clock">--:--</div><div class="date" id="date">Loading...</div></div><div class="zone"><span class="dot"></span>West Lafayette<br>EDT</div></div><div class="row semester"><div class="meta"><div class="label">Semester progress</div><div class="pct" id="semesterPct">0%</div></div><div class="track"><div class="fill" id="semesterFill"></div></div></div><div class="row week"><div class="meta"><div class="label">Week progress</div><div class="pct" id="weekPct">0%</div></div><div class="track"><div class="fill" id="weekFill"></div></div></div><div class="row month"><div class="meta"><div class="label">Month progress</div><div class="pct" id="monthPct">0%</div></div><div class="track"><div class="fill" id="monthFill"></div></div></div><div class="row year"><div class="meta"><div class="label">Year progress</div><div class="pct" id="yearPct">0%</div></div><div class="track"><div class="fill" id="yearFill"></div></div></div><div class="foot"><span>Fall 2026 · Aug 24 → Dec 19</span><span id="semesterDays"></span></div></div><script>const TZ='America/Indiana/Indianapolis';function parts(){const f=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'});return Object.fromEntries(f.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}function localNowMs(){const p=parts();return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)}function clamp(x){return Math.max(0,Math.min(1,x))}function setBar(key,v){v=clamp(v);document.getElementById(key+'Fill').style.width=(v*100)+'%';document.getElementById(key+'Pct').textContent=Math.round(v*100)+'%'}function update(){const now=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(now);document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'}).format(now);const p=parts(),y=+p.year,m=+p.month-1;const t=localNowMs();const semStart=Date.UTC(2026,7,24,0,0,0),semEnd=Date.UTC(2026,11,20,0,0,0);const sem=clamp((t-semStart)/(semEnd-semStart));setBar('semester',sem);const monthStart=Date.UTC(y,m,1,0,0,0),monthEnd=Date.UTC(y,m+1,1,0,0,0);const dow=new Date(t).getUTCDay();const daysSinceMonday=(dow+6)%7;const weekStart=Date.UTC(y,m,+p.day-daysSinceMonday,0,0,0),weekEnd=weekStart+7*86400000;setBar('week',(t-weekStart)/(weekEnd-weekStart));setBar('month',(t-monthStart)/(monthEnd-monthStart));const yearStart=Date.UTC(y,0,1,0,0,0),yearEnd=Date.UTC(y+1,0,1,0,0,0);setBar('year',(t-yearStart)/(yearEnd-yearStart));const elapsed=Math.max(0,Math.floor((t-semStart)/86400000)),total=Math.round((semEnd-semStart)/86400000);document.getElementById('semesterDays').textContent=elapsed+' / '+total+' days'}update();setInterval(update,1000);</script></body></html>
