<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#07121f}.loading{min-height:220px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(155deg,#071522,#05101c);color:#8eacbf;font:12px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="loading">Loading consistency…</div><script>(async()=>{try{let src=await fetch('./habit-heatmap-art.html?crisp=2',{cache:'no-store'}).then(r=>r.text());src=src.replace('linear-gradient(180deg,rgba(4,7,18,.58),rgba(4,7,18,.72))','linear-gradient(180deg,rgba(4,7,18,.30),rgba(4,7,18,.46))').replace(/backdrop-filter:blur\(2px\)/g,'backdrop-filter:none').replace('.cell{border-color:rgba(229,235,255,.16)!important;','.cell{border:1px solid rgba(255,255,255,.44)!important;').replace('.cell.outside{opacity:.16!important}', '.cell.outside{opacity:.36!important}').replace('.cell.future{opacity:.38!important}', '.cell.future{opacity:.55!important}').replace('text-shadow:0 1px 8px rgba(0,0,0,.86)','text-shadow:0 1px 5px rgba(0,0,0,.76)');document.open();document.write(src);document.close()}catch(e){document.body.innerHTML='<div class="loading">Could not load consistency</div>';console.error(e)}})();</script></body></html>
