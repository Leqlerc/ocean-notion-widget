<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habit Consistency</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}
.card{position:relative;overflow:hidden;border:1px solid rgba(198,226,255,.20);border-radius:22px;padding:16px 18px;background:radial-gradient(circle at 12% 0%,rgba(181,221,255,.14),transparent 30%),radial-gradient(circle at 88% 18%,rgba(218,199,255,.11),transparent 32%),linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 14px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05)}
.glow{position:absolute;right:-55px;bottom:-70px;width:190px;height:190px;border-radius:50%;background:rgba(193,214,255,.08);filter:blur(25px);pointer-events:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:12px}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#a9cbe0}.title{font-size:17px;font-weight:760;letter-spacing:-.02em;margin-top:2px}.stats{text-align:right}.big{font-size:13px;font-weight:720}.small{font-size:9px;color:#8199a9;margin-top:2px}
.wrap{overflow:hidden}.months{display:grid;grid-template-columns:22px repeat(17,1fr);gap:4px;margin-bottom:5px;font-size:8px;color:#758d9d;min-width:650px}.month{white-space:nowrap;overflow:visible}
.gridrow{display:grid;grid-template-columns:22px 1fr;gap:5px;min-width:650px}.days{display:grid;grid-template-rows:repeat(7,12px);gap:4px;font-size:8px;color:#748b9a;line-height:12px}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:minmax(12px,1fr);gap:4px}
.cell{height:12px;border-radius:3px;border:1px solid rgba(213,231,244,.08);background:rgba(126,147,161,.11);box-shadow:inset 0 1px 0 rgba(255,255,255,.02);transition:transform .12s ease,border-color .12s ease}.cell:hover{transform:scale(1.15);border-color:rgba(224,239,249,.38);z-index:2}.cell.future{opacity:.32}.cell.outside{opacity:.08}.cell.l1{background:linear-gradient(145deg,#fff0ad,#e9ce72);border-color:rgba(255,239,177,.34)}.cell.l2{background:linear-gradient(145deg,#c7efd4,#8fd0a7);border-color:rgba(198,244,213,.36)}.cell.l3{background:linear-gradient(145deg,#bfe7f8,#8fc7e2);border-color:rgba(192,232,249,.38)}.cell.l4{background:linear-gradient(145deg,#e1d3ff,#b79cf0);border-color:rgba(230,216,255,.43);box-shadow:0 0 8px rgba(189,164,244,.12)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.05);font-size:8px;color:#617b8b}.legend{display:flex;align-items:center;gap:5px}.sw{width:9px;height:9px;border-radius:3px;border:1px solid rgba(255,255,255,.08)}.sw.s0{background:rgba(126,147,161,.11)}.sw.s1{background:#e9ce72}.sw.s2{background:#8fd0a7}.sw.s3{background:#8fc7e2}.sw.s4{background:#b79cf0}
@media(max-width:760px){.wrap{overflow-x:auto;padding-bottom:2px}.months,.gridrow{min-width:620px}.card{padding:15px 16px}.stats{display:none}}
</style>
</head>
<body>
<div class="card"><div class="glow"></div>
<div class="head"><div><div class="eyebrow">Habit consistency</div><div class="title">Fall 2026</div></div><div class="stats"><div class="big" id="summary">0 habit checks</div><div class="small" id="streak">0 day streak</div></div></div>
<div class="wrap"><div class="months" id="months"></div><div class="gridrow"><div class="days"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div><div class="heat" id="heat"></div></div></div>
<div class="foot"><span>Habit tracker history · saved on this device</span><span class="legend">Less <i class="sw s0"></i><i class="sw s1"></i><i class="sw s2"></i><i class="sw s3"></i><i class="sw s4"></i> More</span></div>
</div>
<script>
const TZ='America/Indiana/Indianapolis',SEM_START='2026-08-24',SEM_END='2026-12-19',HABIT_PREFIX='ocean-habits-v3-';
const DAY=86400000;
function dateMs(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function iso(ms){return new Date(ms).toISOString().slice(0,10)}
function tzToday(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day)}
function monday(ms){const dow=new Date(ms).getUTCDay();return ms-((dow+6)%7)*DAY}
function loadWeek(mon){try{return JSON.parse(localStorage.getItem(HABIT_PREFIX+iso(mon)))||{}}catch(e){return{}}}
function score(ms){const mon=monday(ms),obj=loadWeek(mon),arr=obj[iso(ms)];return Array.isArray(arr)?arr.filter(Boolean).length:0}
function level(n){if(n>=5)return'l4';if(n>=4)return'l3';if(n>=3)return'l2';if(n>=1)return'l1';return''}
const start=dateMs(SEM_START),end=dateMs(SEM_END),gridStart=monday(start),weeks=17,today=tzToday();
const months=document.getElementById('months');months.innerHTML='<span></span>';
let lastMonth=-1;
for(let w=0;w<weeks;w++){const ms=gridStart+w*7*DAY,dt=new Date(ms),m=dt.getUTCMonth();const s=document.createElement('span');s.className='month';if(m!==lastMonth){s.textContent=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(dt);lastMonth=m}months.appendChild(s)}
const heat=document.getElementById('heat');let total=0,activeDays=0;
for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const ms=gridStart+(w*7+d)*DAY,n=score(ms),c=document.createElement('div');c.className='cell '+level(n);if(ms<start||ms>end)c.classList.add('outside');if(ms>today)c.classList.add('future');if(ms>=start&&ms<=end&&ms<=today){total+=n;if(n>0)activeDays++}c.title=iso(ms)+' · '+n+'/5 habits';heat.appendChild(c)}
let streak=0;for(let ms=Math.min(today,end);ms>=start;ms-=DAY){if(score(ms)>0)streak++;else break}
document.getElementById('summary').textContent=total+' habit check'+(total===1?'':'s');document.getElementById('streak').textContent=streak+' day streak · '+activeDays+' active days';
</script>
</body>
</html>
