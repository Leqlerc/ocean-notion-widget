<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#07121f}.loading{min-height:260px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(155deg,#071522,#05101c);color:#8eacbf;font:12px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="loading">Loading habits…</div><script>(async()=>{try{let src=await fetch('./habits-art.html?crisp=2',{cache:'no-store'}).then(r=>r.text());src=src.replace('linear-gradient(180deg,rgba(3,8,18,.44),rgba(3,8,18,.60))','linear-gradient(180deg,rgba(3,8,18,.24),rgba(3,8,18,.38))').replace(/backdrop-filter:blur\(3px\)/g,'backdrop-filter:none').replace(/backdrop-filter:blur\(4px\)/g,'backdrop-filter:none').replace('text-shadow:0 1px 8px rgba(0,0,0,.82)','text-shadow:0 1px 5px rgba(0,0,0,.72)');document.open();document.write(src);document.close()}catch(e){document.body.innerHTML='<div class="loading">Could not load habits</div>';console.error(e)}})();</script></body></html>
