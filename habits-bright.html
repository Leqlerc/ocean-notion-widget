<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:transparent}.loading{min-height:420px;border-radius:22px;display:grid;place-items:center;background:#07121f;color:#a8c3d3;font:11px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="loading">Loading habits…</div><script>(async()=>{try{const base=await fetch('./habits-combined.html?bright=2',{cache:'no-store'}).then(r=>r.text());const extra=`<style>
.card{background:linear-gradient(180deg,rgba(2,8,17,.16),rgba(2,8,17,.34)),url("./tree%20covee.png") 50% 50%/cover no-repeat!important;border-color:rgba(225,241,255,.42)!important;box-shadow:0 16px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.10)!important}
.card:before{background:radial-gradient(circle at 15% 4%,rgba(171,226,255,.08),transparent 26%),linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.08))!important}
.panel{background:rgba(4,12,23,.34)!important;border-color:rgba(230,242,255,.20)!important}
.eyebrow,.title,.sub,.day-label,.editor-title,.editor-date,.history-title,.big,.small,.foot{text-shadow:0 1px 5px rgba(0,0,0,.82)!important}
</style>`;const html=base.replace('</head>',extra+'</head>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading">Could not load habits</div>';console.error(e)}})();</script></body></html>
