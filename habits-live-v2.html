<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}.card{position:relative;overflow:hidden;border:1px solid rgba(225,241,255,.42);border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(2,8,17,.16),rgba(2,8,17,.34)),url('./tree%20covee.png') 50% 50%/cover no-repeat;box-shadow:0 16px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.10)}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#c5e3f4;text-shadow:0 1px 5px rgba(0,0,0,.85)}.title{font-size:19px;font-weight:780;margin-top:2px;text-shadow:0 1px 7px rgba(0,0,0,.85)}.sub{font-size:10px;color:#bad1df;text-align:right}.panel{border:1px solid rgba(230,242,255,.20);border-radius:16px;background:rgba(4,12,23,.34);padding:13px 14px 12px}.week{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:9px}.day{display:flex;flex-direction:column;align-items:center;gap:6px}.day-label{font-size:10px;font-weight:720}.day-box{appearance:none;width:52px;height:52px;max-width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.42);background:rgba(13,25,38,.60);cursor:pointer;position:relative}.day-box.selected{outline:2px solid rgba(208,231,255,.60);outline-offset:2px}.day-box.yellow{background:linear-gradient(145deg,#fff0ad,#f1d57c)}.day-box.green{background:linear-gradient(145deg,#c8f0d5,#94d4aa)}.day-box.purple{background:linear-gradient(145deg,#e2d4ff,#bca4f1)}.count{position:absolute;right:6px;bottom:5px;font-size:9px;font-weight:780}.editor{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.10)}.editor-head{display:flex;justify-content:space-between;margin-bottom:9px}.editor-title{font-size:12px;font-weight:720}.editor-date{font-size:10px;color:#b1c9d8}.habits{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.habit{appearance:none;border:1px solid rgba(233,244,255,.25);border-radius:11px;background:rgba(8,20,32,.52);color:#d0e0ea;padding:9px 7px;font:680 10px/1 Inter;cursor:pointer}.habit.on{background:linear-gradient(145deg,rgba(222,212,255,.96),rgba(184,216,255,.94));color:#17222c}.divider{height:1px;background:rgba(255,255,255,.13);margin:15px 0 13px}.history-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}.history-title{font-size:14px;font-weight:760}.stats{text-align:right}.big{font-size:12px;font-weight:720}.small{font-size:9px;color:#b1c5d2}.months{display:grid;grid-template-columns:22px repeat(17,1fr);gap:4px;margin-bottom:5px;font-size:8px;color:#b3c7d4;min-width:650px}.gridrow{display:grid;grid-template-columns:22px 1fr;gap:5px;min-width:650px}.days{display:grid;grid-template-rows:repeat(7,12px);gap:4px;font-size:8px;color:#afc3d0;line-height:12px}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:minmax(12px,1fr);gap:4px}.cell{height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.42);background:rgba(7,18,30,.52)}.cell.future{opacity:.36}.cell.outside{opacity:.13}.cell.l1{background:#e9ce72}.cell.l2{background:#8fd0a7}.cell.l3{background:#8fc7e2}.cell.l4{background:#b79cf0}.foot{display:flex;justify-content:space-between;margin-top:10px;font-size:8px;color:#a9bfcc}.status{font-size:8px;color:#a9bfcc}@media(max-width:760px){.months,.gridrow{min-width:620px;overflow-x:auto}}@media(max-width:520px){.card{padding:14px}.week{gap:6px}.day-box{width:44px;height:44px}.habits{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="card"><div class="head"><div><div class="eyebrow">Habit tracker</div><div class="title">This week</div></div><div class="sub" id="weekRange"></div></div><div class="panel"><div class="week" id="week"></div><div class="editor"><div class="editor-head"><div class="editor-title" id="editorTitle">Today</div><div class="editor-date" id="editorDate"></div></div><div class="habits" id="habits"></div></div></div><div class="divider"></div><div class="history-head"><div><div class="eyebrow">Habit consistency</div><div class="history-title">Fall 2026</div></div><div class="stats"><div class="big" id="summary">0 habit checks</div><div class="small" id="streak">0 day streak</div></div></div><div class="panel"><div class="months" id="months"></div><div class="gridrow"><div class="days"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div><div class="heat" id="heat"></div></div><div class="foot"><span class="status" id="status">connecting…</span><span>Notion · live</span></div></div></div><script>const TZ='America/Indiana/Indianapolis',DAY=86400000,START='2026-08-24',END='2026-12-19',API='/api/dashboard?scope=daily',HABITS=['Meditate','Journal','Sleep early','Pray','Chinese'],LABELS=['M','T','W','T','F','S','S'];let DAYS={};const $=id=>document.getElementById(id);function tzToday(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day)}function monday(ms){const d=new Date(ms).getUTCDay();return ms-((d+6)%7)*DAY}function iso(ms){return new Date(ms).toISOString().slice(0,10)}function fmt(ms,o){return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',...o}).format(new Date(ms))}function dateMs(s){const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)}const currentMonday=monday(tzToday());let selected=Math.max(0,Math.min(6,Math.round((tzToday()-currentMonday)/DAY)));function values(k){const h=DAYS[k]?.habits||{};return HABITS.map(x=>!!h[x])}function score(k){return values(k).filter(Boolean).length}function stateClass(n){if(n===5)return'purple';if(n>=3)return'green';if(n>=1)return'yellow';return''}function renderWeek(){const root=$('week');root.innerHTML='';for(let i=0;i<7;i++){const k=iso(currentMonday+i*DAY),n=score(k),wrap=document.createElement('div'),lab=document.createElement('div'),btn=document.createElement('button'),c=document.createElement('span');wrap.className='day';lab.className='day-label';lab.textContent=LABELS[i];btn.className='day-box '+stateClass(n)+(i===selected?' selected':'');c.className='count';c.textContent=n+'/5';btn.appendChild(c);btn.onclick=()=>{selected=i;renderAll()};wrap.append(lab,btn);root.appendChild(wrap)}}async function write(k,name,val){DAYS[k]=DAYS[k]||{habits:{}};DAYS[k].habits=DAYS[k].habits||{};DAYS[k].habits[name]=val;renderAll();try{const r=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:k,changes:{[name]:val}})});if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json();DAYS=x.days||DAYS;renderAll()}catch(e){$('status').textContent='sync error';console.error(e)}}function renderEditor(){const ms=currentMonday+selected*DAY,k=iso(ms),vals=values(k);$('editorTitle').textContent=k===iso(tzToday())?'Today':fmt(ms,{weekday:'long'});$('editorDate').textContent=fmt(ms,{month:'short',day:'numeric'});const root=$('habits');root.innerHTML='';HABITS.forEach((name,j)=>{const b=document.createElement('button');b.className='habit'+(vals[j]?' on':'');b.textContent=name;b.onclick=()=>write(k,name,!vals[j]);root.appendChild(b)})}function level(n){if(n>=5)return'l4';if(n>=4)return'l3';if(n>=3)return'l2';if(n>=1)return'l1';return''}function renderHeat(){const start=dateMs(START),end=dateMs(END),gs=monday(start),today=tzToday();$('months').innerHTML='<span></span>';$('heat').innerHTML='';let lm=-1,total=0,active=0;for(let w=0;w<17;w++){const ms=gs+w*7*DAY,m=new Date(ms).getUTCMonth(),s=document.createElement('span');if(m!==lm){s.textContent=fmt(ms,{month:'short'});lm=m}$('months').appendChild(s)}for(let w=0;w<17;w++)for(let d=0;d<7;d++){const ms=gs+(w*7+d)*DAY,k=iso(ms),n=score(k),c=document.createElement('div');c.className='cell '+level(n);if(ms<start||ms>end)c.classList.add('outside');if(ms>today)c.classList.add('future');if(ms>=start&&ms<=end&&ms<=today){total+=n;if(n)active++}c.title=k+' · '+n+'/5 habits';$('heat').appendChild(c)}let streak=0;for(let ms=Math.min(today,end);ms>=start;ms-=DAY){if(score(iso(ms))>0)streak++;else break}$('summary').textContent=total+' habit check'+(total===1?'':'s');$('streak').textContent=streak+' day streak · '+active+' active days'}function renderAll(){renderWeek();renderEditor();renderHeat()}async function refresh(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json();DAYS=x.days||{};$('status').textContent='live · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});renderAll()}catch(e){$('status').textContent='sync error';console.error(e)}}$('weekRange').textContent=fmt(currentMonday,{month:'short',day:'numeric'})+' – '+fmt(currentMonday+6*DAY,{month:'short',day:'numeric'});renderAll();refresh();setInterval(refresh,15000);</script></body></html>
