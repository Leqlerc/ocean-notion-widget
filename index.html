<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}.card{position:relative;overflow:hidden;border:1px solid rgba(198,226,255,.22);border-radius:22px;padding:18px 18px 16px;background:radial-gradient(circle at 18% 10%,rgba(173,216,255,.15),transparent 30%),radial-gradient(circle at 82% 18%,rgba(205,194,255,.12),transparent 32%),linear-gradient(155deg,rgba(7,20,34,.96),rgba(5,13,25,.96));box-shadow:0 14px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05)}.glow{position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(177,222,255,.09);filter:blur(20px);pointer-events:none}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#a9cbe0}.clock{font-size:34px;line-height:1;font-weight:700;letter-spacing:-.04em}.date{margin-top:5px;font-size:12px;color:#abc0cf}.zone{font-size:11px;color:#93a9ba;text-align:right}.row{margin-top:13px}.meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.label{font-size:12px;font-weight:650;letter-spacing:.01em}.pct{font-size:12px;color:#c8e6f7;font-variant-numeric:tabular-nums}.track{height:16px;border-radius:999px;background:rgba(180,203,220,.11);box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),inset 0 2px 5px rgba(0,0,0,.3);overflow:hidden}.fill{height:100%;width:0;border-radius:999px;box-shadow:0 0 16px rgba(170,210,255,.22);transition:width .6s ease}.semester .fill{background:linear-gradient(90deg,#b9f3ff,#addcff 52%,#c6c2ff 100%)}.week .fill{background:linear-gradient(90deg,#c8f5d8,#b8ebdc 52%,#b6def4 100%)}.month .fill{background:linear-gradient(90deg,#ffe8b5,#ffd0c5 50%,#f2c8df 100%)}.year .fill{background:linear-gradient(90deg,#c9c7ff,#d4c4f3 52%,#e5c4ea 100%)}.quota{margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.06)}.quota-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}.quota-title{font-size:12px;font-weight:700;letter-spacing:.01em}.quota-count{font-size:11px;color:#9fb8c8;font-variant-numeric:tabular-nums}.quota-row{display:flex;align-items:center;gap:10px}.quota-name{font-size:11px;color:#92aaba;width:48px;flex:0 0 48px}.quota-circles{display:flex;justify-content:space-between;gap:7px;flex:1}.quota-item{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}.quota-circle{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:50%;border:1px solid rgba(205,226,240,.24);background:rgba(164,195,216,.08);color:#b9cbd7;font:700 10px/1 Inter,ui-sans-serif,system-ui;cursor:pointer;display:grid;place-items:center;transition:transform .16s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease,color .2s ease}.quota-circle:hover{transform:translateY(-1px);border-color:rgba(215,235,248,.42)}.quota-circle.quality-yellow,.quota-circle.quality-green,.quota-circle.quality-purple{color:#18222b;border-color:rgba(255,255,255,.46);box-shadow:0 0 15px rgba(205,223,255,.16),inset 0 1px 0 rgba(255,255,255,.48)}.quota-circle.quality-yellow{background:linear-gradient(145deg,#fff1ad,#f4d77b)}.quota-circle.quality-green{background:linear-gradient(145deg,#c9f2d5,#96d7ad)}.quota-circle.quality-purple{background:linear-gradient(145deg,#e2d3ff,#bba2f2)}.quota-circle.rest{border-style:dashed;color:#7f96a5;background:rgba(140,160,175,.05)}.quota-circle.rest.done{background:linear-gradient(145deg,#d9dde3,#bfc9d2);color:#34424d;border-style:solid}.quota-day{font-size:8.5px;color:#708999;letter-spacing:.02em}.quota-legend{display:flex;justify-content:flex-end;gap:9px;margin-top:8px;font-size:8.5px;color:#7f97a7}.legend-item{display:flex;align-items:center;gap:4px}.legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block}.legend-dot.yellow{background:#f4d77b}.legend-dot.green{background:#96d7ad}.legend-dot.purple{background:#bba2f2}.quota-hint{margin-top:5px;text-align:right;font-size:8px;color:#657f90}.foot{display:flex;justify-content:space-between;margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.05);font-size:10.5px;color:#829aaa}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#bdeaff;box-shadow:0 0 10px rgba(189,234,255,.62);margin-right:6px;vertical-align:1px}@media(max-width:360px){.quota-row{gap:6px}.quota-name{width:40px;flex-basis:40px}.quota-circles{gap:4px}.quota-circle{width:25px;height:25px}.quota-legend{gap:6px}}</style></head><body><div class="card"><div class="glow"></div><div class="top"><div><div class="eyebrow">Ocean dashboard</div><div class="clock" id="clock">--:--</div><div class="date" id="date">Loading...</div></div><div class="zone"><span class="dot"></span>West Lafayette<br>EDT</div></div><div class="row semester"><div class="meta"><div class="label">Semester progress</div><div class="pct" id="semesterPct">0%</div></div><div class="track"><div class="fill" id="semesterFill"></div></div></div><div class="row week"><div class="meta"><div class="label">Week progress</div><div class="pct" id="weekPct">0%</div></div><div class="track"><div class="fill" id="weekFill"></div></div></div><div class="row month"><div class="meta"><div class="label">Month progress</div><div class="pct" id="monthPct">0%</div></div><div class="track"><div class="fill" id="monthFill"></div></div></div><div class="row year"><div class="meta"><div class="label">Year progress</div><div class="pct" id="yearPct">0%</div></div><div class="track"><div class="fill" id="yearFill"></div></div></div><div class="quota"><div class="quota-head"><div class="quota-title">Weekly quota</div><div class="quota-count" id="workoutCount">0 / 6 workouts</div></div><div class="quota-row"><div class="quota-name">Workout</div><div class="quota-circles" id="workoutQuota"><div class="quota-item"><button class="quota-circle" data-slot="0" title="Push · click to rate">P</button><span class="quota-day">M</span></div><div class="quota-item"><button class="quota-circle" data-slot="1" title="Pull · click to rate">P</button><span class="quota-day">T</span></div><div class="quota-item"><button class="quota-circle" data-slot="2" title="Legs · click to rate">L</button><span class="quota-day">W</span></div><div class="quota-item"><button class="quota-circle rest" data-slot="3" data-rest="true" title="Rest">R</button><span class="quota-day">T</span></div><div class="quota-item"><button class="quota-circle" data-slot="4" title="Push · click to rate">P</button><span class="quota-day">F</span></div><div class="quota-item"><button class="quota-circle" data-slot="5" title="Pull · click to rate">P</button><span class="quota-day">S</span></div><div class="quota-item"><button class="quota-circle" data-slot="6" title="Legs · click to rate">L</button><span class="quota-day">S</span></div></div></div><div class="quota-legend"><span class="legend-item"><span class="legend-dot yellow"></span>not great</span><span class="legend-item"><span class="legend-dot green"></span>productive</span><span class="legend-item"><span class="legend-dot purple"></span>great</span></div><div class="quota-hint">click again to change rating</div></div><div class="foot"><span>Fall 2026 · Aug 24 → Dec 19</span><span id="semesterDays"></span></div></div><script>const TZ='America/Indiana/Indianapolis';function parts(){const f=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'});return Object.fromEntries(f.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}function localNowMs(){const p=parts();return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)}function clamp(x){return Math.max(0,Math.min(1,x))}function setBar(key,v){v=clamp(v);document.getElementById(key+'Fill').style.width=(v*100)+'%';document.getElementById(key+'Pct').textContent=Math.round(v*100)+'%'}function mondayKey(){const p=parts();const d=Date.UTC(+p.year,+p.month-1,+p.day);const dow=new Date(d).getUTCDay();const monday=d-((dow+6)%7)*86400000;return new Date(monday).toISOString().slice(0,10)}function quotaStorageKey(){return'ocean-workout-quota-v2-'+mondayKey()}const QUALITY=['','green','purple','yellow'];function applyQuotaState(btn,state){btn.classList.remove('quality-yellow','quality-green','quality-purple','done');if(btn.dataset.rest==='true'){if(state==='rest')btn.classList.add('done');return}if(state==='yellow'||state==='green'||state==='purple')btn.classList.add('quality-'+state)}function getQuotaState(btn){if(btn.dataset.rest==='true')return btn.classList.contains('done')?'rest':'';if(btn.classList.contains('quality-yellow'))return'yellow';if(btn.classList.contains('quality-green'))return'green';if(btn.classList.contains('quality-purple'))return'purple';return''}function loadQuota(){let state=['','','','','','',''];try{const saved=JSON.parse(localStorage.getItem(quotaStorageKey()));if(Array.isArray(saved)&&saved.length===7)state=saved}catch(e){}document.querySelectorAll('.quota-circle').forEach((btn,i)=>applyQuotaState(btn,state[i]||''));updateQuotaCount()}function saveQuota(){const state=[...document.querySelectorAll('.quota-circle')].map(getQuotaState);try{localStorage.setItem(quotaStorageKey(),JSON.stringify(state))}catch(e){}updateQuotaCount()}function updateQuotaCount(){const buttons=[...document.querySelectorAll('.quota-circle:not([data-rest="true"])')];const done=buttons.filter(btn=>getQuotaState(btn)!=='').length;document.getElementById('workoutCount').textContent=done+' / 6 workouts'}document.querySelectorAll('.quota-circle').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.rest==='true'){btn.classList.toggle('done');saveQuota();return}const current=getQuotaState(btn);const next=QUALITY[(QUALITY.indexOf(current)+1)%QUALITY.length];applyQuotaState(btn,next);saveQuota()}));function update(){const now=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(now);document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'}).format(now);const p=parts(),y=+p.year,m=+p.month-1;const t=localNowMs();const semStart=Date.UTC(2026,7,24,0,0,0),semEnd=Date.UTC(2026,11,20,0,0,0);setBar('semester',(t-semStart)/(semEnd-semStart));const monthStart=Date.UTC(y,m,1,0,0,0),monthEnd=Date.UTC(y,m+1,1,0,0,0);const dow=new Date(t).getUTCDay();const daysSinceMonday=(dow+6)%7;const weekStart=Date.UTC(y,m,+p.day-daysSinceMonday,0,0,0),weekEnd=weekStart+7*86400000;setBar('week',(t-weekStart)/(weekEnd-weekStart));setBar('month',(t-monthStart)/(monthEnd-monthStart));const yearStart=Date.UTC(y,0,1,0,0,0),yearEnd=Date.UTC(y+1,0,1,0,0,0);setBar('year',(t-yearStart)/(yearEnd-yearStart));const elapsed=Math.max(0,Math.floor((t-semStart)/86400000)),total=Math.round((semEnd-semStart)/86400000);document.getElementById('semesterDays').textContent=elapsed+' / '+total+' days'}loadQuota();update();setInterval(update,1000);</script></body></html>
