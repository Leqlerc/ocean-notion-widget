<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f5fbff}.card{position:relative;overflow:hidden;border:1px solid rgba(230,237,255,.36);border-radius:22px;padding:17px 18px;background:linear-gradient(180deg,rgba(8,5,24,.36),rgba(5,5,20,.64)),url('./jellyshroom.png') 50% 52%/cover no-repeat;box-shadow:0 16px 40px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.08)}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:12px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#d9c9f2}.title{font-size:18px;font-weight:780;margin-top:2px}.stats{text-align:right}.big{font-size:12px;font-weight:720}.small{font-size:9px;color:#c2b6d3;margin-top:2px}.panel{border:1px solid rgba(242,235,255,.17);border-radius:16px;background:rgba(9,7,24,.44);padding:12px 13px 10px}.months{display:grid;grid-template-columns:22px repeat(17,1fr);gap:4px;margin-bottom:5px;font-size:8px;color:#c7bcd6;min-width:650px}.gridrow{display:grid;grid-template-columns:22px 1fr;gap:5px;min-width:650px}.days{display:grid;grid-template-rows:repeat(7,14px);gap:4px;font-size:8px;color:#c6bbd3;line-height:14px}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:minmax(14px,1fr);gap:4px}.cell{height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.48);background:rgba(11,10,27,.56);cursor:pointer}.cell.future{opacity:.28;cursor:default}.cell.outside{opacity:.10;cursor:default}.cell.today{outline:2px solid rgba(255,255,255,.82);outline-offset:1px}.cell.yellow{background:linear-gradient(145deg,#fff2a9,#e8c84f)}.cell.green{background:linear-gradient(145deg,#baf3ca,#55c878)}.cell.purple{background:linear-gradient(145deg,#e0ceff,#9f76e8)}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:8.5px;color:#c0b4cf}.legend{display:flex;gap:7px}.item{display:flex;align-items:center;gap:4px}.sw{width:9px;height:9px;border-radius:3px}.s1{background:#e8c84f}.s2{background:#55c878}.s3{background:#9f76e8}@media(max-width:760px){.wrap{overflow-x:auto}.months,.gridrow{min-width:620px}.stats{display:none}}</style></head><body><div class="card"><div class="head"><div><div class="eyebrow">Productivity</div><div class="title">Fall 2026</div></div><div class="stats"><div class="big" id="todayStatus">Today · unmarked</div><div class="small" id="ratedCount">0 days rated</div></div></div><div class="panel"><div class="wrap"><div class="months" id="months"></div><div class="gridrow"><div class="days"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div><div class="heat" id="heat"></div></div></div><div class="foot"><span class="legend"><span class="item"><i class="sw s1"></i>Yellow</span><span class="item"><i class="sw s2"></i>Green</span><span class="item"><i class="sw s3"></i>Purple</span></span><span id="status">connecting…</span></div></div></div><script>const TZ='America/Indiana/Indianapolis',START='2026-08-24',END='2026-12-19',DAY=86400000,API='/api/dashboard?scope=daily';let DAYS={};const $=id=>document.getElementById(id);function dateMs(s){const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)}function iso(ms){return new Date(ms).toISOString().slice(0,10)}function tzToday(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day)}function monday(ms){const d=new Date(ms).getUTCDay();return ms-((d+6)%7)*DAY}function val(k){return DAYS[k]?.productivity||''}function cls(v){return v?String(v).toLowerCase():''}function next(v){return v==='Yellow'?'Green':v==='Green'?'Purple':v==='Purple'?'':'Yellow'}async function write(k,v){DAYS[k]=DAYS[k]||{};DAYS[k].productivity=v;render();try{const r=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:k,changes:{Productivity:v}})});if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json();DAYS=x.days||DAYS;render()}catch(e){$('status').textContent='sync error';console.error(e)}}function render(){const start=dateMs(START),end=dateMs(END),gs=monday(start),today=tzToday();$('months').innerHTML='<span></span>';$('heat').innerHTML='';let lm=-1,rated=0;for(let w=0;w<17;w++){const ms=gs+w*7*DAY,m=new Date(ms).getUTCMonth(),s=document.createElement('span');if(m!==lm){s.textContent=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(new Date(ms));lm=m}$('months').appendChild(s)}for(let w=0;w<17;w++)for(let d=0;d<7;d++){const ms=gs+(w*7+d)*DAY,k=iso(ms),v=val(k),c=document.createElement('div');c.className='cell '+cls(v);if(ms<start||ms>end)c.classList.add('outside');if(ms>today)c.classList.add('future');if(ms===today)c.classList.add('today');if(ms>=start&&ms<=end&&ms<=today&&v)rated++;c.title=k+' · '+(v||'unmarked');if(ms>=start&&ms<=end&&ms<=today)c.onclick=()=>write(k,next(v));$('heat').appendChild(c)}$('todayStatus').textContent='Today · '+(val(iso(today))||'unmarked');$('ratedCount').textContent=rated+' day'+(rated===1?'':'s')+' rated'}async function refresh(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json();DAYS=x.days||{};$('status').textContent='Notion live · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render()}catch(e){$('status').textContent='sync error';console.error(e)}}render();refresh();setInterval(refresh,15000);</script></body></html>
