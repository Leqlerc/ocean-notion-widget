<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Productivity · Fall 2026</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f5fbff}
.card{position:relative;overflow:hidden;border:1px solid rgba(230,237,255,.36);border-radius:22px;padding:17px 18px;background:linear-gradient(180deg,rgba(8,5,24,.36),rgba(5,5,20,.64)),url("./jellyshroom.png") 50% 52%/cover no-repeat;box-shadow:0 16px 40px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.08)}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 82% 8%,rgba(215,180,255,.12),transparent 27%),linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.13))}
.card>*{position:relative;z-index:1}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:12px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#d9c9f2;text-shadow:0 1px 5px rgba(0,0,0,.85)}.title{font-size:18px;font-weight:780;letter-spacing:-.02em;margin-top:2px;text-shadow:0 1px 7px rgba(0,0,0,.88)}.stats{text-align:right}.big{font-size:12px;font-weight:720}.small{font-size:9px;color:#c2b6d3;margin-top:2px}
.panel{border:1px solid rgba(242,235,255,.17);border-radius:16px;background:rgba(9,7,24,.44);padding:12px 13px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(1px)}
.wrap{overflow:hidden}.months{display:grid;grid-template-columns:22px repeat(17,1fr);gap:4px;margin-bottom:5px;font-size:8px;color:#c7bcd6;min-width:650px}.month{white-space:nowrap;overflow:visible}.gridrow{display:grid;grid-template-columns:22px 1fr;gap:5px;min-width:650px}.days{display:grid;grid-template-rows:repeat(7,14px);gap:4px;font-size:8px;color:#c6bbd3;line-height:14px}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:minmax(14px,1fr);gap:4px}.cell{height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.48);background:rgba(11,10,27,.56);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}.cell:hover{transform:scale(1.13);border-color:rgba(255,255,255,.90);z-index:2}.cell.future{opacity:.28;cursor:default}.cell.outside{opacity:.10;cursor:default}.cell.today{outline:2px solid rgba(255,255,255,.82);outline-offset:1px}.cell.yellow{background:linear-gradient(145deg,#fff2a9,#e8c84f);border-color:rgba(255,255,255,.78);box-shadow:0 0 9px rgba(238,203,80,.16)}.cell.green{background:linear-gradient(145deg,#baf3ca,#55c878);border-color:rgba(255,255,255,.80);box-shadow:0 0 9px rgba(85,200,120,.17)}.cell.purple{background:linear-gradient(145deg,#e0ceff,#9f76e8);border-color:rgba(255,255,255,.84);box-shadow:0 0 11px rgba(159,118,232,.22)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:8.5px;color:#c0b4cf}.legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.item{display:flex;align-items:center;gap:4px}.sw{width:9px;height:9px;border-radius:3px;border:1px solid rgba(255,255,255,.58)}.s1{background:#e8c84f}.s2{background:#55c878}.s3{background:#9f76e8}.hint{text-align:right}
@media(max-width:760px){.wrap{overflow-x:auto;padding-bottom:2px}.months,.gridrow{min-width:620px}.stats{display:none}}@media(max-width:520px){.card{padding:14px}.hint{display:none}}
</style>
</head>
<body>
<div class="card">
  <div class="head"><div><div class="eyebrow">Productivity</div><div class="title">Fall 2026</div></div><div class="stats"><div class="big" id="todayStatus">Today · unmarked</div><div class="small" id="ratedCount">0 days rated</div></div></div>
  <div class="panel"><div class="wrap"><div class="months" id="months"></div><div class="gridrow"><div class="days"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div><div class="heat" id="heat"></div></div></div><div class="foot"><span class="legend"><span class="item"><i class="sw s1"></i>Yellow</span><span class="item"><i class="sw s2"></i>Green</span><span class="item"><i class="sw s3"></i>Purple</span></span><span class="hint">Click a day to cycle · saved on this device</span></div></div>
</div>
<script>
const TZ='America/Indiana/Indianapolis',SEM_START='2026-08-24',SEM_END='2026-12-19',KEY='ocean-productivity-v1',DAY=86400000;
function dateMs(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function iso(ms){return new Date(ms).toISOString().slice(0,10)}
function tzToday(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day)}
function monday(ms){const dow=new Date(ms).getUTCDay();return ms-((dow+6)%7)*DAY}
let data={};try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){data={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function cls(v){return v===1?'yellow':v===2?'green':v===3?'purple':''}
function label(v){return v===1?'Yellow':v===2?'Green':v===3?'Purple':'unmarked'}
const start=dateMs(SEM_START),end=dateMs(SEM_END),gridStart=monday(start),weeks=17;
function render(){const today=tzToday(),months=document.getElementById('months'),heat=document.getElementById('heat');months.innerHTML='<span></span>';heat.innerHTML='';let lastMonth=-1,rated=0;for(let w=0;w<weeks;w++){const ms=gridStart+w*7*DAY,dt=new Date(ms),m=dt.getUTCMonth(),s=document.createElement('span');s.className='month';if(m!==lastMonth){s.textContent=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(dt);lastMonth=m}months.appendChild(s)}for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const ms=gridStart+(w*7+d)*DAY,k=iso(ms),v=data[k]||0,c=document.createElement('div');c.className='cell '+cls(v);if(ms<start||ms>end)c.classList.add('outside');if(ms>today)c.classList.add('future');if(ms===today)c.classList.add('today');if(ms>=start&&ms<=end&&ms<=today&&v)rated++;c.title=k+' · '+label(v);if(ms>=start&&ms<=end&&ms<=today){c.addEventListener('click',()=>{const next=((data[k]||0)+1)%4;if(next)data[k]=next;else delete data[k];save();render()})}heat.appendChild(c)}const tv=data[iso(today)]||0;document.getElementById('todayStatus').textContent='Today · '+label(tv);document.getElementById('ratedCount').textContent=rated+' day'+(rated===1?'':'s')+' rated'}
render();window.addEventListener('storage',e=>{if(e.key===KEY){try{data=JSON.parse(e.newValue)||{}}catch(_){data={}}render()}});
</script>
</body>
</html>
