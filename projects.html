<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOcean · Projects</title>
<link rel="stylesheet" href="/nocean.css?v=2"><link rel="stylesheet" href="/nocean-tweaks.css?v=3"><link rel="stylesheet" href="/nocean-decorated.css?v=1"><link rel="stylesheet" href="/nocean-appearance.css?v=2"><link rel="stylesheet" href="/nocean-modules.css?v=1"><link rel="stylesheet" href="/projects.css?v=1">
<script src="/nocean-shared.js?v=2" defer></script><script src="/nocean-data.js?v=2" defer></script><script src="/nocean-ui.js?v=5" defer></script><script src="/nocean-deadlines.js?v=2" defer></script><script src="/nocean-filters.js?v=1" defer></script><script src="/nocean-planning.js?v=1" defer></script><script src="/nocean-appearance.js?v=4" defer></script><script src="/project-model.js?v=1" defer></script><script src="/project-plan.js?v=1" defer></script><script src="/projects.js?v=2" defer></script></head>
<body data-page="projects"><div class="app module-app"><header class="topbar"><h1>NOcean.</h1><div data-app-controls></div><button id="refresh">Refresh</button></header>
<main><div class="module-intro"><p class="eyebrow">Keep the longer view</p><h2>Projects</h2><p>Choose a direction. Make the next action clear.</p></div>
<p id="projectStatus" role="status">Loading projects…</p>
<section id="projectIndex" class="card module-card"><div class="card-head"><h2>Your projects</h2><button id="newProject" class="primary" disabled>New project</button></div>
<div class="module-fields"><label>Search projects<input id="projectSearch" type="search" placeholder="Find a project"></label><label>Project status<select id="statusFilter"><option>Active</option><option>Completed</option><option>Archived</option><option value="all">All statuses</option></select></label></div><div id="projectGrid" class="project-workspaces"></div></section>
<section id="projectDetail" hidden aria-label="Project workspace"></section></main></div>
<dialog id="projectEditor" aria-labelledby="projectEditorTitle"><form id="projectForm"><h2 id="projectEditorTitle">New project</h2><fieldset id="projectFields"><label id="nameField">Project name<input id="projectName" maxlength="100" required></label><label>Target date<input id="projectDue" type="date"></label><label id="lifecycleField">Lifecycle<select id="projectLifecycle"><option>Active</option><option>Completed</option><option>Archived</option></select></label><p>Completing a project keeps its related tasks. Archiving hides it from the active list.</p></fieldset><p id="projectError" role="alert"></p><div class="module-actions"><button type="button" id="cancelProject">Cancel</button><button type="submit" id="saveProject" class="primary">Save project</button></div></form></dialog>
<dialog id="goalEditor" aria-labelledby="goalEditorTitle"><form id="goalForm"><h2 id="goalEditorTitle">Goal item</h2><label>Type<select id="goalKind"><option value="objective">Objective</option><option value="milestone">Milestone</option><option value="overview">Overview</option><option value="note">Note / consideration</option></select></label><label>Text<textarea id="goalText" maxlength="1800" rows="5" required></textarea></label><label id="goalDueField" hidden>Milestone date<input id="goalDue" type="date"></label><p id="goalError" role="alert"></p><div class="module-actions"><button id="goalRemove" type="button" hidden>Remove item</button><button id="goalCancel" type="button">Cancel</button><button id="goalSave" type="submit">Save goal item</button></div></form></dialog></body></html>
