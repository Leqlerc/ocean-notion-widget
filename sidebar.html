<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean Sidebar</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f4fbff}
body{padding:0}
.stack{display:grid;gap:10px}
.card{position:relative;overflow:hidden;border:1px solid rgba(198,226,255,.18);border-radius:20px;padding:14px;background:radial-gradient(circle at 12% 0%,rgba(163,216,255,.14),transparent 28%),radial-gradient(circle at 94% 18%,rgba(210,194,255,.10),transparent 31%),linear-gradient(155deg,rgba(7,20,34,.97),rgba(5,13,25,.97));box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.045)}
.card:after{content:"";position:absolute;right:-42px;bottom:-52px;width:130px;height:130px;border-radius:50%;background:rgba(178,218,255,.07);filter:blur(20px);pointer-events:none}
.eyebrow{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8fb5cb;font-weight:700}
.title{font-size:14px;font-weight:760;letter-spacing:-.015em;margin-top:2px}
.muted{color:#8199a8}
.weather-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.weather-main{display:flex;align-items:center;gap:10px;margin-top:9px}
.weather-icon{font-size:32px;line-height:1;filter:drop-shadow(0 3px 9px rgba(160,215,255,.18))}
.temp{font-size:31px;font-weight:780;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.condition{font-size:10px;color:#a9c0cf;margin-top:4px}
.weather-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.metric{padding:7px 6px;border:1px solid rgba(211,230,243,.10);border-radius:10px;background:rgba(134,176,202,.055);text-align:center}
.metric-label{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:#6f8b9d}
.metric-value{font-size:10px;font-weight:700;margin-top:2px;color:#dceaf3}
.weather-error{font-size:10px;color:#9fb4c3;margin-top:10px}
.focus-head{display:flex;justify-content:space-between;align-items:end;gap:8px}
.focus-count{font-size:9px;color:#7f98a8;font-variant-numeric:tabular-nums}
.focus-list{display:grid;gap:7px;margin-top:11px}
.focus-row{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:7px}
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:1px solid rgba(207,229,243,.18);background:rgba(143,178,202,.07);cursor:pointer;position:relative;transition:.18s ease}
.check:hover{border-color:rgba(217,236,248,.35)}
.check.on{background:linear-gradient(145deg,#d8ccff,#a9c8f2);border-color:rgba(229,220,255,.65);box-shadow:0 0 14px rgba(191,202,255,.12)}
.check.on:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#16232d;font-size:13px;font-weight:900}
.focus-input{width:100%;border:1px solid rgba(211,230,243,.10);border-radius:9px;background:rgba(143,178,202,.05);color:#dfeef7;padding:7px 8px;font:600 10px/1.2 Inter,ui-sans-serif,system-ui;outline:none}
.focus-input::placeholder{color:#5f7889}
.focus-input:focus{border-color:rgba(190,220,255,.30);background:rgba(143,178,202,.08)}
.focus-row.done .focus-input{color:#718796;text-decoration:line-through}
.focus-foot{font-size:8px;color:#587183;margin-top:9px;text-align:right}
@media(max-width:330px){.temp{font-size:28px}.card{padding:12px}}
</style>
</head>
<body>
<div class="stack">
  <section class="card" id="weatherCard">
    <div class="weather-top">
      <div><div class="eyebrow">Weather</div><div class="title">West Lafayette</div></div>
      <div class="muted" id="weatherTime" style="font-size:9px"></div>
    </div>
    <div class="weather-main" id="weatherMain">
      <div class="weather-icon" id="weatherIcon">◌</div>
      <div><div class="temp" id="temp">--°</div><div class="condition" id="condition">Loading forecast…</div></div>
    </div>
    <div class="weather-meta">
      <div class="metric"><div class="metric-label">Feels</div><div class="metric-value" id="feels">--°</div></div>
      <div class="metric"><div class="metric-label">High / Low</div><div class="metric-value" id="hiLo">-- / --</div></div>
      <div class="metric"><div class="metric-label">Rain</div><div class="metric-value" id="rain">--%</div></div>
    </div>
    <div class="weather-error" id="weatherError" hidden>Forecast unavailable right now.</div>
  </section>

  <section class="card">
    <div class="focus-head"><div><div class="eyebrow">Daily focus</div><div class="title">Top 3</div></div><div class="focus-count" id="focusCount">0 / 3</div></div>
    <div class="focus-list" id="focusList"></div>
    <div class="focus-foot">resets each day · saved on this device</div>
  </section>
</div>

<script>
const TZ='America/Indiana/Indianapolis';
function localParts(){const p=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());return Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}
function localDateKey(){const p=localParts();return `${p.year}-${p.month}-${p.day}`}
function fmtTime(){return new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).format(new Date())}
const WEATHER_URL='https://api.open-meteo.com/v1/forecast?latitude=40.4237&longitude=-86.9212&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FIndiana%2FIndianapolis&forecast_days=2';
const WMO={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],61:['🌦️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['❄️','Snow grains'],80:['🌦️','Rain showers'],81:['🌧️','Rain showers'],82:['⛈️','Heavy showers'],85:['🌨️','Snow showers'],86:['🌨️','Heavy snow showers'],95:['⛈️','Thunderstorms'],96:['⛈️','Storms + hail'],99:['⛈️','Storms + hail']};
async function loadWeather(){document.getElementById('weatherTime').textContent=fmtTime();try{const r=await fetch(WEATHER_URL,{cache:'no-store'});if(!r.ok)throw new Error('weather');const w=await r.json(),c=w.current||{},d=w.daily||{},desc=WMO[c.weather_code]||['🌊','Current conditions'];document.getElementById('weatherIcon').textContent=desc[0];document.getElementById('temp').textContent=Math.round(c.temperature_2m)+'°';document.getElementById('condition').textContent=desc[1];document.getElementById('feels').textContent=Math.round(c.apparent_temperature)+'°';document.getElementById('hiLo').textContent=Math.round(d.temperature_2m_max?.[0])+'° / '+Math.round(d.temperature_2m_min?.[0])+'°';document.getElementById('rain').textContent=Math.round(d.precipitation_probability_max?.[0]||0)+'%';document.getElementById('weatherError').hidden=true}catch(e){document.getElementById('condition').textContent='Forecast unavailable';document.getElementById('weatherError').hidden=false}}
loadWeather();setInterval(()=>{document.getElementById('weatherTime').textContent=fmtTime()},60000);setInterval(loadWeather,30*60000);
const focusKey='ocean-daily-focus-v1-'+localDateKey();let focus=[{text:'',done:false},{text:'',done:false},{text:'',done:false}];try{const x=JSON.parse(localStorage.getItem(focusKey));if(Array.isArray(x)&&x.length===3)focus=x}catch(e){}
function saveFocus(){try{localStorage.setItem(focusKey,JSON.stringify(focus))}catch(e){}}
function renderFocus(){const root=document.getElementById('focusList');root.innerHTML='';focus.forEach((item,i)=>{const row=document.createElement('div');row.className='focus-row'+(item.done?' done':'');const check=document.createElement('button');check.className='check'+(item.done?' on':'');check.setAttribute('aria-label','Complete focus item');check.onclick=()=>{focus[i].done=!focus[i].done;saveFocus();renderFocus()};const input=document.createElement('input');input.className='focus-input';input.value=item.text;input.placeholder=`Focus ${i+1}`;input.maxLength=80;input.addEventListener('input',()=>{focus[i].text=input.value;saveFocus()});row.append(check,input);root.appendChild(row)});document.getElementById('focusCount').textContent=focus.filter(x=>x.done).length+' / 3'}
renderFocus();
</script>
</body>
</html>
