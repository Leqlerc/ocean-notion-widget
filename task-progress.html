<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f5fbff}
.card{position:relative;overflow:hidden;min-height:150px;border:1px solid rgba(225,241,255,.42);border-radius:22px;padding:17px 19px;background:linear-gradient(180deg,rgba(2,8,17,.14),rgba(2,8,17,.32)),url('./grand%20reef.png') 50% 48%/cover no-repeat;box-shadow:0 16px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.10)}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 7%,rgba(145,225,255,.07),transparent 29%),linear-gradient(180deg,rgba(0,0,0,0),rgba(1,7,14,.09))}
.content{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{--pct:14.6;width:108px;height:108px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#8fe7ff calc(var(--pct)*1%),#c6a5ff calc(var(--pct)*1%),rgba(210,229,242,.22) 0);box-shadow:0 0 22px rgba(134,215,255,.20),inset 0 0 0 1px rgba(255,255,255,.18)}
.ring:before{content:"";width:82px;height:82px;border-radius:50%;background:rgba(4,13,26,.76);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 0 18px rgba(0,0,0,.36)}
.ringText{position:absolute;text-align:center;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.78)}
.percent{font-size:25px;font-weight:800;letter-spacing:-.045em}
.percentLabel{margin-top:6px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#c7dce8}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#c7e2f0;margin-bottom:4px;text-shadow:0 1px 5px rgba(0,0,0,.82)}
.title{font-size:19px;font-weight:780;letter-spacing:-.025em;margin-bottom:12px;text-shadow:0 1px 6px rgba(0,0,0,.82)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.stat strong{display:block;font-size:20px;line-height:1;font-weight:780;text-shadow:0 1px 5px rgba(0,0,0,.80)}
.stat span{display:block;margin-top:5px;font-size:10px;color:#c3d8e4;text-shadow:0 1px 4px rgba(0,0,0,.82)}
.track{height:11px;border-radius:999px;border:1px solid rgba(236,246,255,.62);background:rgba(2,9,18,.58);overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.04)}
.fill{height:100%;width:14.6%;border-radius:999px;background:linear-gradient(90deg,#83e8ff,#9ed6ff 55%,#c5a6ff);border-right:1px solid rgba(255,255,255,.5);box-shadow:0 0 14px rgba(164,219,255,.28)}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:9.5px;color:#b7cbd7;text-shadow:0 1px 4px rgba(0,0,0,.82)}
@media(max-width:520px){.card{padding:14px 15px}.content{grid-template-columns:88px 1fr;gap:14px}.ring{width:88px;height:88px}.ring:before{width:66px;height:66px}.percent{font-size:21px}.title{font-size:17px}.stats{gap:15px}.stat strong{font-size:18px}}
</style>
</head>
<body>
<div class="card">
  <div class="content">
    <div style="position:relative;display:grid;place-items:center">
      <div class="ring" style="--pct:14.6"></div>
      <div class="ringText"><div class="percent">14.6%</div><div class="percentLabel">complete</div></div>
    </div>
    <div>
      <div class="eyebrow">Task progress</div>
      <div class="title">Your to-do list</div>
      <div class="stats">
        <div class="stat"><strong>15</strong><span>done</span></div>
        <div class="stat"><strong>88</strong><span>remaining</span></div>
        <div class="stat"><strong>103</strong><span>total</span></div>
      </div>
      <div class="track"><div class="fill"></div></div>
      <div class="foot"><span>All Tasks master</span><span>15 of 103 completed</span></div>
    </div>
  </div>
</div>
</body>
</html>
