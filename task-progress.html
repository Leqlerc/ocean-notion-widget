<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f5fbff}
.card{position:relative;overflow:hidden;border:1px solid rgba(225,241,255,.42);border-radius:22px;padding:17px 19px;background:linear-gradient(180deg,rgba(2,8,17,.14),rgba(2,8,17,.32)),url('./grand%20reef.png') 50% 48%/cover no-repeat;box-shadow:0 16px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.10)}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 7%,rgba(145,225,255,.07),transparent 29%),linear-gradient(180deg,rgba(0,0,0,0),rgba(1,7,14,.09))}
.content{position:relative;z-index:1;display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center}
.todayPane{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.todayLabel{font-size:11px;font-weight:760;letter-spacing:.08em;text-transform:uppercase;color:#e7f6ff;margin-bottom:8px;text-shadow:0 1px 5px rgba(0,0,0,.82)}
.ringWrap{position:relative;display:grid;place-items:center}
.ring{--pct:71.4;width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#78e7ff calc(var(--pct)*1%),#a8d6ff calc(var(--pct)*1%),#c8adff calc(var(--pct)*1%),rgba(214,233,245,.20) 0);box-shadow:0 0 24px rgba(133,218,255,.22),inset 0 0 0 1px rgba(255,255,255,.18);transition:background .35s ease}
.ring:before{content:"";width:87px;height:87px;border-radius:50%;background:rgba(4,13,26,.74);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 0 18px rgba(0,0,0,.36)}
.ringText{position:absolute;text-align:center;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.todayPct{font-size:27px;font-weight:820;letter-spacing:-.045em;line-height:1}
.todayCount{margin-top:6px;font-size:9.5px;color:#c8dce7;white-space:nowrap}
.right{min-width:0}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#c7e2f0;margin-bottom:3px;text-shadow:0 1px 5px rgba(0,0,0,.82)}
.title{font-size:19px;font-weight:780;letter-spacing:-.025em;margin-bottom:14px;text-shadow:0 1px 6px rgba(0,0,0,.82)}
.row{margin-top:14px}.row:first-of-type{margin-top:0}
.meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;text-shadow:0 1px 5px rgba(0,0,0,.82)}
.label{font-size:12px;font-weight:740;color:#eef8ff}.detail{font-size:10px;color:#c0d4df;white-space:nowrap}.pct{font-size:12px;font-weight:800;color:#f5fbff;margin-left:8px}
.track{height:14px;border-radius:999px;border:1px solid rgba(236,246,255,.62);background:rgba(2,9,18,.58);overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.04)}
.fill{height:100%;width:0;border-radius:999px;border-right:1px solid rgba(255,255,255,.48);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 14px rgba(164,219,255,.24);transition:width .35s ease}
.week .fill{background:linear-gradient(90deg,#83e2bd,#8fded8 52%,#99cff5)}
.all .fill{background:linear-gradient(90deg,#9a91ff,#bea0ec 55%,#dda6df)}
.foot{margin-top:11px;font-size:9px;color:#b7cbd7;text-shadow:0 1px 4px rgba(0,0,0,.82)}
.foot.stale{color:#ffd9a8;font-weight:760}
@media(max-width:620px){.card{padding:14px 15px}.content{grid-template-columns:108px minmax(0,1fr);gap:14px}.ring{width:92px;height:92px}.ring:before{width:68px;height:68px}.todayPct{font-size:22px}.todayCount{font-size:8.5px}.title{font-size:17px}.label{font-size:11px}.detail{font-size:9px}.track{height:13px}}
</style>
</head>
<body>
<div class="card">
  <div class="content">
    <div class="todayPane">
      <div class="todayLabel">Today</div>
      <div class="ringWrap">
        <div class="ring" id="todayRing" style="--pct:71.4"></div>
        <div class="ringText"><div class="todayPct" id="todayPct">71.4%</div><div class="todayCount" id="todayCount">5 / 7 done</div></div>
      </div>
    </div>

    <div class="right">
      <div class="eyebrow">Task progress</div>
      <div class="title">Your to-do list</div>

      <div class="row week">
        <div class="meta"><span class="label">This Week</span><span><span class="detail" id="weekCount">12 / 16 done</span><span class="pct" id="weekPct">75%</span></span></div>
        <div class="track"><div class="fill" id="weekFill" style="width:75%"></div></div>
      </div>

      <div class="row all">
        <div class="meta"><span class="label">All Tasks</span><span><span class="detail" id="allCount">21 / 80 done</span><span class="pct" id="allPct">26.2%</span></span></div>
        <div class="track"><div class="fill" id="allFill" style="width:26.2%"></div></div>
      </div>

      <div class="foot" id="syncStatus">Live data · connecting…</div>
    </div>
  </div>
</div>
<script>
const API_URL='/api/task-progress';
const RAW_URL='https://raw.githubusercontent.com/Leqlerc/ocean-notion-widget/main/task-progress.json';
const PAGES_URL='./task-progress.json';
let lastUpdated=null;
let lastSource='';
const $=id=>document.getElementById(id);
function pctText(v){const n=Number(v)||0;return (Number.isInteger(n)?n:n.toFixed(1))+'%'}
function apply(data,source){
  for(const key of ['today','week','all'])if(!data[key])throw new Error('Incomplete progress data');
  $('todayRing').style.setProperty('--pct',data.today.pct||0);
  $('todayPct').textContent=pctText(data.today.pct);
  $('todayCount').textContent=`${data.today.done} / ${data.today.total} done`;
  $('weekFill').style.width=(data.week.pct||0)+'%';
  $('weekPct').textContent=pctText(data.week.pct);
  $('weekCount').textContent=`${data.week.done} / ${data.week.total} done`;
  $('allFill').style.width=(data.all.pct||0)+'%';
  $('allPct').textContent=pctText(data.all.pct);
  $('allCount').textContent=`${data.all.done} / ${data.all.total} done`;
  lastUpdated=data.updated_at?new Date(data.updated_at):new Date();
  lastSource=source;
  updateStatus();
}
function updateStatus(){
  if(!lastUpdated)return;
  const s=Math.max(0,Math.floor((Date.now()-lastUpdated.getTime())/1000));
  const age=s<60?`${s}s ago`:s<3600?`${Math.floor(s/60)}m ago`:`${Math.floor(s/3600)}h ago`;
  const stale=s>45;
  $('syncStatus').classList.toggle('stale',stale);
  $('syncStatus').textContent=stale
    ? `SYNC STALE · ${lastSource} · last update ${age}`
    : `Live data · ${lastSource} · updated ${age}`;
}
async function fetchJson(url,timeoutMs=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const sep=url.includes('?')?'&':'?';
    const r=await fetch(url+sep+'t='+Date.now(),{cache:'no-store',credentials:'omit',signal:controller.signal});
    if(!r.ok){
      let detail='';
      try{detail=JSON.stringify(await r.json())}catch(_){detail=await r.text()}
      throw new Error('HTTP '+r.status+' '+detail);
    }
    return await r.json();
  }finally{clearTimeout(timer)}
}
async function refresh(){
  try{
    try{
      apply(await fetchJson(API_URL),'notion');
      return;
    }catch(apiError){
      console.warn('Vercel API unavailable; using fallback',apiError);
    }
    try{
      apply(await fetchJson(RAW_URL,4000),'fallback');
    }catch(rawError){
      apply(await fetchJson(PAGES_URL,4000),'fallback');
    }
  }catch(e){
    console.error(e);
    $('syncStatus').classList.add('stale');
    $('syncStatus').textContent='SYNC ERROR · retrying…';
  }
}
refresh();
setInterval(refresh,10000);
setInterval(updateStatus,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
