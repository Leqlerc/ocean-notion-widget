<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOcean · Tasks</title>
<link rel="stylesheet" href="/nocean.css?v=2"><link rel="stylesheet" href="/nocean-tweaks.css?v=3"><link rel="stylesheet" href="/nocean-decorated.css?v=1"><link rel="stylesheet" href="/nocean-appearance.css?v=2"><link rel="stylesheet" href="/nocean-modules.css?v=1">
<script src="/nocean-shared.js?v=2" defer></script><script src="/nocean-data.js?v=1" defer></script><script src="/nocean-ui.js?v=4" defer></script><script src="/nocean-deadlines.js?v=2" defer></script><script src="/nocean-filters.js?v=1" defer></script><script src="/nocean-planning.js?v=1" defer></script><script src="/nocean-icons.js?v=1" defer></script><script src="/nocean-appearance.js?v=4" defer></script><script src="/tasks.js?v=2" defer></script></head>
<body data-page="tasks"><div class="app module-app"><header class="topbar"><h1>NOcean.</h1><div data-app-controls></div><button id="refresh">Refresh</button></header>
<main><div class="module-intro"><p class="eyebrow">Make room for what matters</p><h2>Tasks</h2><p>Plan the work. Keep the deadline.</p></div>
<section class="card module-card" data-cosmetic="tasks" data-default-art="kelp-forest"><div class="card-head"><h2>Capture</h2></div><form id="capture"><label>Task name<input id="taskName" required maxlength="500" placeholder="What needs doing?"></label><div class="module-fields"><label>Plan<select id="capturePlan"><option value="today">Today</option><option value="tomorrow">Tomorrow</option><option value="later">Backlog</option></select></label><label>Project<select id="captureProject"><option value="">No project</option></select></label><label>Difficulty<select id="captureDifficulty"><option>Unrated</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label><label>Due date<input id="captureDue" type="date"></label><label>Time · optional<input id="captureTime" type="time"></label><button type="submit" class="primary" id="captureSave">Add task</button></div><small>No time selected → 11:59 PM local. Planning never changes this deadline.</small></form></section>
<section class="card module-card"><nav id="taskViews" class="module-tabs" aria-label="Task views"><button data-view="today">Today</button><button data-view="tomorrow">Tomorrow</button><button data-view="upcoming">Upcoming</button><button data-view="later">Later / Backlog</button><button data-view="all">All</button></nav><p id="viewHint"></p><div class="module-fields"><label>Search<input id="search" type="search" placeholder="Task or course"></label><label>Project<select id="projectFilter"><option value="all">All projects</option></select></label><label>Difficulty<select id="difficultyFilter"><option value="all">All levels</option><option>Unrated</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label><label class="check-label"><input type="checkbox" id="showDone"> Show done</label></div><p id="deferredNotice" class="overdue"></p><p id="taskStatus" role="status">Loading tasks…</p><div id="moduleTasks"></div><button id="moreTasks" hidden>Show more</button></section></main></div>
<dialog id="taskEditor" aria-labelledby="editorTitle"><form id="editForm"><h2 id="editorTitle">Edit task</h2><input id="editId" type="hidden"><label>Name<input id="editName" required maxlength="500"></label><div class="module-fields"><label>Due date<input id="editDue" type="date"></label><label>Time · optional<input id="editTime" type="time"></label><label>Difficulty<select id="editDifficulty"><option>Unrated</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label><label>Project<select id="editProject"></select></label></div><p class="section-note">Use the row buttons to change your work plan without moving the deadline.</p><p id="editError" role="alert"></p><div class="module-actions"><button type="button" id="archiveTask">Archive</button><button type="button" id="cancelEdit">Cancel</button><button type="submit" id="saveEdit" class="primary">Save</button></div></form></dialog><div id="moduleToast" class="module-toast" role="status" hidden></div></body></html>
